timing_policy:
  version: 2
  scope: metadata-only public API calls and output descriptor retention; no session,
    synchronization or BLAS needed
  setup: inputs, transfers, runtime/session/handles, plans and compilation outside
    timer
  cleanup: returned outputs retained until after timer stops
  minimum_untimed_priming_runs: 1
  short_operation_sampling: many operations per interval; shared session where supported;
    see docs/short-operation-sessions.md
  trace_execution: prepare_compiled outside timing; run_prepared inside
  setup_diagnostics: false
  lifetime_contract:
    metadata: consumes owned dtype-erased DynRank TensorValue
    host: borrows typed Host view; each separately retained owner outlives input/output
      views
    static: Rank<1> slice; Rank<2> transpose; Rank<1> reshape input returns DynRank
