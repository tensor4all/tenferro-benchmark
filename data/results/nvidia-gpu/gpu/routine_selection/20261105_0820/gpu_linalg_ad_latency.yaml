schema_version: 1
suite_id: gpu/linalg_ad_latency
title: GPU Linalg AD Single-Call Latency Benchmarks
description: Single-call latency and per-op overhead of trace-mode linalg AD on CUDA at n=2, 4, 8. Device
  kernel time is a small fraction of each measurement, so these rows are latency/overhead diagnostics,
  not GPU throughput.
defaults:
  regime: latency
  device:
    kind: cuda
    ordinal: 0
  layout:
    tenferro: col_major
    framework: row_major_contiguous
  run:
    warmups: 3
    runs: 7
    timing_scope: steady_state_host_api_plus_device_sync
  verify:
    reference: cpu_fp64
    rtol: 1.0e-05
    atol: 1.0e-08
backends:
- tenferro-cuda-trace
- pytorch-cuda
- jax-cuda
