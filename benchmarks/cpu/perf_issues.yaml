# Generated by scripts/generate_perf_issue_cases.py; do not edit.
schema_version: 1
suite_id: cpu/perf_issues
title: Workloads of open tenferro-rs performance issues (CPU)
description: 'One case family per open tenferro-rs performance issue (#1615, #1803, #1885, #1900, #1975,
  #1976, #1990, #1992, #1995, #2003, #2006, #2007, #2008, #2021, #2027, #2028, #2029, #2030, #2031, #2032,
  #2033, #2034, #2035, #2036, #2037, #2038, #2039, #2040), each with its reference arm(s); the issue numbers
  are recorded per case in data/instances/perf_issues.json. Workloads are added when an issue is opened;
  perf-fix PRs report numbers from these cases. Steady-state rows and labelled diagnostics are reported
  separately. #1865 and #1863 live in cpu/einsum.'
defaults:
  device:
    kind: cpu
    ordinal: 0
  run:
    warmups: 3
    runs: 15
    min_runtime_ms: 2
    timing_scope: steady_state_host_api
  effort:
    scan:
      warmups: 1
      runs: 3
  verify:
    reference: independent f64 scalar references, residuals and analytic gradients
    rtol: 0.0001
    atol: 0
