schema_version: 2
suite_id: cpu/small_work
title: CPU small-work public boundary contracts
description: F64 add/einsum/solve and C64 concrete/prepared/runtime einsum, including F64 borrowed layouts.
contract_version: 2
protocol:
  warmups: 1
  runs: 3
  independent_processes: 2
  samples_per_process: 3
  calibration:
    enabled: true
    target_ns: 1000000
  noise_policy:
    process_median_cov_max: 0.10
  resource_policy:
    busy_threshold: 0.2
    requested_threads: 1
cases:
  - id: add_f64_concrete_fresh
    contract_id: core.add.ordinary.concrete
    family: core
    surface: concrete
    operation: add
    phase: execution
    api_tier: concrete-fresh
    backend: tenferro-rs
    dtype: f64
    layout: col_major_contiguous
    shape: [4]
    calls_per_workflow: 1
    workflow: single
    setup:
      includes: [session_entry_exit, add, output_lifetime]
      excludes: [backend_construction, input_construction, correctness_check]
    scope:
      timer: [session_entry_exit, add, output_lifetime]
      outside_timer: [backend_construction, input_construction, correctness_check]
