schema_version: 1
suite_id: cpu/small_work
title: CPU small-work public API benchmarks
description: 154 saved F64 add/einsum/solve/gather/reduce_sum and C64 einsum cases.
defaults:
  device:
    kind: cpu
    ordinal: 0
  run:
    warmups: 3
    runs: 15
    min_runtime_ms: 1
    timing_scope: steady_state_host_api
  verify:
    reference: independent analytic values, solve residuals, and AD gradients
    rtol: 0
    atol: 1.0e-12
backends:
- tenferro-rs
