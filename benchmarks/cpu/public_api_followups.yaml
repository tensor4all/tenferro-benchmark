schema_version: 1
suite_id: cpu/public_api_followups
title: CPU Public API Follow-up Benchmarks
description: Thirteen activation, normalization, reduction and indexing APIs previously measured only in perf_issues; direct and borrowed-session eager calls with equivalent native PyTorch/JAX operations.
defaults:
  # Provisional: this catalogue still mixes size classes; the CPU family floors
  # are a follow-up to docs/regime-floors.md, so the whole suite keeps the
  # classification the dashboard published before the regime rule.
  regime: throughput
  device: {kind: cpu, ordinal: 0}
  layout: {tenferro: col_major, framework: row_major_contiguous}
  run: {warmups: 3, runs: 15, timing_scope: steady_state_host_api}
  verify: {reference: pytorch, rtol: 2.0e-5, atol: 2.0e-5}
backends: [tenferro-direct, tenferro-eager, tenferro-trace, pytorch-cpu, jax-cpu]
problems:
  source: generated
  # `generated` is a sentinel, not a path: `scripts/public_api_followups.py`
  # declares its operation names and shapes and
  # `src/bin/benchmark_cpu_public_api/followups.rs` emits them, so this
  # checkout ships no catalogue file.  Absence is the expected state, and the
  # validator names the skip on every run.
  missing_source: skip
  include: [neural_public_api]
