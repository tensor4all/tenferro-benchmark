schema_version: 2
scope:
  description: Operation-level coverage of public tenferro-rs numerical tensor APIs with a meaningful PyTorch CPU counterpart.
  rules:
    - TypedTensor wrappers and TensorRead values backed by an owned contiguous Tensor are aliases only when they dispatch to the same backend kernel.
    - Non-contiguous TensorRead paths are not aliases; any claimed coverage must name a dedicated view/materialization benchmark.
    - Caller-owned-output APIs are distinct because allocation behavior changes.
    - Graph construction, compilation, fixture allocation, and plan construction are outside timing.
    - Provider-unsupported APIs remain present as explicit unsupported rows.
    - Thin call-layer spellings are aliases only when they dispatch the same operation; this suite compares operation work, not wrapper-call nanoseconds.
    - An alias establishes operation (kernel) coverage only. It never establishes latency, wrapper, session-boundary or route coverage; those are claimed only by the `routes` section, and a route counts as covered only when every case it names executed and passed (scripts/route_coverage.py routes).
    - Every spelling must exist in the tenferro-rs revision under test (scripts/route_coverage.py entrypoints); removed spellings are deleted, not kept as aliases.

coverage:
  - family: elementwise
    tenferro_apis:
      - TensorElementwise::{add_read,sub_read,mul_read,div_read}
    pytorch: torch.{add,sub,mul,div}
    disposition: measured
    benchmarks: cpu/elementwise_reduction::{add,sub,mul,div}
  - family: elementwise_output
    tenferro_apis:
      - TensorElementwise::{add_into,add_read_into,sub_into,sub_read_into,mul_into,mul_read_into,div_into,div_read_into}
    pytorch: torch.{add,sub,mul,div}(out=...)
    disposition: measured
    benchmarks: cpu/output_reuse::{add_into,sub_into,mul_into,div_into}
  - family: unary_elementwise
    tenferro_apis:
      - TensorElementwise::{neg_read,abs_read,sign_read,conj_read}
    pytorch: torch.{neg,abs,sign,conj_physical}
    disposition: measured
    benchmarks: cpu/elementwise_reduction::{neg,abs,sign}; cpu/complex/conj
  - family: unary_elementwise_output
    tenferro_apis:
      - TensorElementwise::{neg_into,neg_read_into,conj_into,conj_read_into}
    pytorch: torch.{neg,conj_physical}(out=...)
    disposition: measured
    benchmarks: cpu/output_reuse::{neg_into,conj_into}
  - family: remaining_elementwise
    tenferro_apis:
      - TensorElementwise::{rem,rem_read,maximum_read,minimum_read,compare_read,select_read,clamp_read}
    pytorch: torch.{remainder,maximum,minimum,lt,where,clamp}
    disposition: measured
    benchmarks: cpu/elementwise_reduction::{rem,maximum,minimum,compare_lt,select,clamp}
  - family: analytic
    tenferro_apis:
      - TensorAnalytic::{exp_read,log_read,sin_read,cos_read,tanh_read,sqrt_read,rsqrt_read,pow_read,expm1_read,log1p_read}
    pytorch: torch.{exp,log,sin,cos,tanh,sqrt,rsqrt,pow,expm1,log1p}
    disposition: measured
    benchmarks: cpu/elementwise_reduction::{exp,log,sin,cos,tanh,sqrt,rsqrt,pow,expm1,log1p}
  - family: reductions
    tenferro_apis:
      - TensorReduction::{reduce_sum_read,reduce_prod_read,reduce_max_read,reduce_min_read}
    pytorch: torch.{sum,prod,max,min}
    disposition: measured
    benchmarks: cpu/elementwise_reduction::{reduce_sum_all,reduce_prod_all,reduce_max_all,reduce_min_all,reduce_max_axis0,reduce_max_axis1,reduce_min_axis0,reduce_min_axis1,reduce_sum_axis0,reduce_sum_axis1,reduce_prod_axis0,reduce_prod_axis1}
  - family: newly_discovered_session_ops
    tenferro_apis:
      - TensorSessionOpsExt::reduce_sum_squares
      - TypedTensorSessionOpsExt::reduce_sum_squares
      - TensorSessionOpsExt::masked_log_softmax
      - TypedTensorSessionOpsExt::masked_log_softmax
      - TensorSessionOpsExt::where_select
      - TypedTensorMaskSessionOpsExt::where_select
    pytorch: torch.sum(x.square(), dim=...); torch.log_softmax(x.masked_fill(~mask, -inf), dim=...)
    jax: jax.numpy.sum(jax.numpy.square(x), axis=...); jax.nn.log_softmax(x, where=mask, axis=...)
    julia: sum(x .^ 2; dims=...); masked log-softmax composition
    disposition: implemented_not_collected
    benchmarks: cpu/elementwise_reduction::{reduce_sum_squares_axis0,masked_log_softmax_axis1,where_select}
    reason: Added through the uncovered-public-API path; the audit script fails when a public session method has no benchmark-source evidence.

  - family: structural
    tenferro_apis:
      - TensorStructural::{transpose_read,reshape_read,broadcast_in_dim_read,cast,convert,extract_diagonal,embed_diagonal,tril,triu}
    pytorch: Tensor.{transpose,reshape,expand,to,diagonal}; torch.{diag,tril,triu}
    disposition: measured
    benchmarks: cpu/structural_shape::{transpose,reshape,broadcast_in_dim,cast_f64_f32,extract_diagonal,embed_diagonal,tril,triu}
  - family: view_metadata
    tenferro_apis:
      - TensorValue::{transpose_view,reshape_view,slice_view,broadcast_in_dim_view}
      - TypedTensorView::{transpose_view,reshape_view,slice_view,slice_axis_view}
      - TypedTensorViewMut::{transpose_view,reshape_view,slice_view,slice_axis_view}
    pytorch: Tensor.{transpose,reshape,slicing,expand}
    disposition: measured
    benchmarks: cpu/view_metadata
    reason: Dedicated metadata-only rows compare view creation without mixing it into materialized operation timings; JAX has no public strided-view/aliasing contract.
  - family: eager_session_operation_spellings
    tenferro_apis:
      - EagerSession::{add,sub,mul,neg,exp,reduce_sum,dot_general,dot_general_with_conj,matmul,transpose,reshape,slice,broadcast_in_dim,convert,cast,pad,reverse,gather,scatter,dynamic_slice,concatenate,extract_diag,embed_diag,tril,triu,reduce_prod,reduce_max,reduce_min}
      - EagerSliceBuilder::{new,axis,axis_step,take_axis,apply}
    pytorch: corresponding torch/Tensor operations
    disposition: alias
    benchmarks: cpu/public_api operation rows; cpu/cpu_ops matmul rows
    reason: These borrowed-session eager methods dispatch the same measured backend operations (kernel coverage only). The report labels the concrete column as direct API rather than claiming to measure eager wrapper or session-entry overhead; eager session routes are claimed only in `routes`.
  - family: eager_session_scalar_scale
    tenferro_apis:
      - EagerSession::{scale_real,scale_complex}
    pytorch: Tensor multiplied by a scalar
    disposition: alias
    benchmarks: cpu/elementwise_reduction/mul; cpu/complex/mul
    reason: The methods construct a rank-0 scalar and dispatch the measured multiplication operation; scalar construction overhead is intentionally outside the operation-level comparison.
  - family: contiguous_copy
    tenferro_apis:
      - TensorStructural::to_contiguous_read
      - TensorViewCanonicalization::to_contiguous (on an entered execution session; tenferro-rs issue 1946 F6 removed the owner route)
    pytorch: Tensor.contiguous
    disposition: measured
    benchmarks: cpu/permutation materialize rows
  - family: caller_copy
    tenferro_apis:
      - TensorStructural::copy_read_into
      - TensorViewCanonicalization::copy_into (on an entered execution session)
    pytorch: Tensor.copy_
    disposition: measured
    benchmarks: cpu/output_reuse/copy_read_into
  - family: indexing
    tenferro_apis:
      - TensorIndexing::{gather,scatter,slice,dynamic_slice,dynamic_update_slice,pad,concatenate,reverse}
    pytorch: torch.{gather,scatter}; Tensor slicing/update; torch.nn.functional.pad; torch.{cat,flip}
    disposition: measured
    benchmarks: cpu/indexing_layout::{gather,scatter,slice,dynamic_slice,dynamic_update_slice,pad,concatenate,reverse}
  - family: traced_shape_convenience
    tenferro_apis:
      - TracedTensor::{slice_axis,take_axis,index_select,stack,concatenate}
    pytorch: Tensor slicing; torch.{index_select,stack,cat}
    disposition: alias
    benchmarks: cpu/indexing_layout::{slice,gather,concatenate}
    reason: Convenience graph builders lower to the measured primitive operations; graph construction is outside timing.

  - family: dot
    tenferro_apis:
      - TensorDot::{dot_general_read,dot_general_with_conj,dot_general_with_conj_read}
    pytorch: torch.matmul; conjugated torch.matmul
    disposition: measured
    benchmarks: cpu/complex::{dot_general,dot_general_with_conj}; cpu/einsum matmul rows
  - family: dot_output
    tenferro_apis:
      - TensorDot::{dot_general_read_into,dot_general_read_into_accum}
    pytorch: torch.mm(out=...); torch.addmm(out=...)
    disposition: measured
    benchmarks: cpu/output_reuse::{dot_general_read_into,dot_general_read_into_accum}
  - family: dot_cached
    tenferro_apis:
      - SessionCachedDot::{dot_general_cached,dot_general_read_cached,dot_general_with_conj_cached,dot_general_with_conj_read_cached,dot_general_read_into_accum_cached}
    pytorch: warmed torch.matmul/torch.addmm with framework-owned caches
    disposition: alias
    benchmarks: cpu/einsum matmul rows; cpu/output_reuse/dot_general_read_into_accum
    reason: PyTorch exposes no equivalent caller-owned GEMM plan object; warmed calls are the closest fair comparison.
  - family: grouped_gemm
    tenferro_apis:
      - SessionCachedDot::grouped_gemm_cached
    pytorch: null
    disposition: no_direct_pytorch
    reason: PyTorch has no public heterogeneous grouped-GEMM CPU API.

  - family: einsum
    tenferro_apis:
      - TensorEinsumExt::{einsum,einsum_subscripts}
      - TypedTensorEinsumExt::{einsum,einsum_subscripts}
      - TensorReadEinsumExt::{einsum_read,einsum_read_subscripts}
      - TypedTensorReadEinsumExt::{einsum_read,einsum_read_subscripts}
    pytorch: torch.einsum
    disposition: measured
    benchmarks: cpu/einsum_concrete/einsum_ij_jk_ik
  - family: eager_and_traced_einsum
    tenferro_apis:
      - EagerSessionEinsumExt::{einsum,einsum_notation,einsum_subscripts}
      - TraceContextEinsumExt::{einsum,einsum_subscripts,einsum_with,einsum_subscripts_with}
    pytorch: torch.einsum
    disposition: measured
    benchmarks: cpu/einsum report
  - family: tensordot
    tenferro_apis:
      - TensorTensordotExt::tensordot
      - TypedTensorTensordotExt::tensordot
      - EagerSessionEinsumExt::tensordot
      - TracedTensorEinsumExt::tensordot
    pytorch: torch.tensordot
    disposition: measured
    benchmarks: cpu/complex/tensordot
  - family: einsum_output
    tenferro_apis:
      - TensorEinsumIntoExt::{einsum_into,einsum_into_subscripts}
      - TypedTensorEinsumIntoExt::{einsum_into,einsum_into_subscripts}
      - TensorReadEinsumIntoExt::{einsum_read_into,einsum_read_into_subscripts}
      - TypedTensorReadEinsumIntoExt::{einsum_read_into,einsum_read_into_subscripts}
    pytorch: null
    disposition: no_direct_pytorch
    reason: torch.einsum has no out parameter.

  - family: fft
    tenferro_apis:
      - TensorFftExt::{fft,ifft,rfft,irfft}
      - TensorReadFftExt::{fft_read,ifft_read,rfft_read,irfft_read}
      - EagerSessionFftExt::{fft,ifft,rfft,irfft}
      - EagerTensorFftExt::{fft_in_place,ifft_in_place}
      - TracedTensorFftExt::{fft,ifft,rfft,irfft}
    pytorch: torch.fft.{fft,ifft,rfft,irfft}
    disposition: measured
    benchmarks: cpu/fft report
    reason: TensorReadFftExt has dedicated rows because it includes a distinct materialization and one-shot planning path.

  - family: linalg
    tenferro_apis:
      - TensorLinalgExt::{svd,qr,lu,solve,cholesky,eigh,eig,triangular_solve,slogdet,det,inv,eigvalsh,eigvals,pinv,pinv_with_rtol,norm}
      - TensorReadLinalgExt::{svd_read,qr_read,lu_read,solve_read,cholesky_read,eigh_read,eig_read,triangular_solve_read,slogdet_read,det_read,inv_read,eigvalsh_read,eigvals_read,pinv_read,pinv_with_rtol_read,norm_read}
      - TypedTensorLinalgExt::{svd,qr,lu,solve,cholesky,eigh,eig,triangular_solve,slogdet,det,inv,eigvalsh,eigvals}
      - EagerSessionLinalgExt::lstsq
      - TracedTensorLinalgExt::{svd,qr,lu,solve,lstsq,cholesky,eigh,eig,triangular_solve,slogdet,det,inv,eigvalsh,eigvals,pinv,pinv_with_rtol,norm}
    pytorch: torch.linalg equivalents
    disposition: measured
    benchmarks: cpu/cpu_ops; cpu/linalg_uncovered; cpu/linalg_batched::batched_triangular_solve
  - family: batched_prepared_lu
    tenferro_apis:
      - LinalgBackend::{lu_factor,lu_solve_prepared} (doc hidden, on CpuExecSession)
      - TensorLinalgExt::triangular_solve
      - TracedTensorLinalgExt::triangular_solve
    pytorch: torch.linalg.{lu_factor,lu_solve,solve_triangular}
    disposition: measured
    benchmarks: cpu/linalg_batched::{batched_lu_factor,batched_lu_solve,batched_triangular_solve}
    reason: Batch 1024 at n in {2,4,8,16} with one rhs column separates the packed LU factorization from the solve that reuses prepared factors. LinalgOp is not public, so bare LU factor and prepared solve rows are unsupported in trace mode; the traced solve (LuFactor plus LuSolvePrepared) and its backward are measured by cpu/cpu_ops batched_solve and grad_sum_batched_solve_backward. Performance issue tenferro-rs #1884 (batched LU factor/solve 1024x{8,16} does not scale from 1T to 4T) is reported from the 1024x8x8 and 1024x16x16 batched_lu_factor / batched_lu_solve rows at both thread counts.
  - family: batched_linalg_families
    tenferro_apis:
      - TensorLinalgExt::{solve,cholesky,qr,eigh,eigvalsh,svd,svdvals,lu}
      - TracedTensorLinalgExt::{solve,cholesky,qr,eigh,eigvalsh,svd,lu}
    pytorch: torch.linalg.{solve,cholesky,qr,eigh,eigvalsh,svd,svdvals,lu}
    disposition: measured
    benchmarks: cpu/linalg_batch_families::{batched_solve,batched_cholesky,batched_qr,batched_eigh,batched_eigvalsh,batched_svd,batched_svdvals,batched_lu}
    reason: Batched [rows, cols, batch] inputs (n in {2,4,8} x batch in {1,3,4,8,1024}, n in {32,128} x batch in {1,8}, tall 64x24) for the families tenferro-rs routes through the batched tlinalg/tlinalg-blas providers (tenferro-rs#1956); they separate the batch fan-out from the single-item and max(rows, cols) > 64 Auto paths (tenferro-rs#2000). svd and eigh also run on c64. TracedTensor has no svdvals, so batched_svdvals is an explicit unsupported trace row; Julia rows are not provided for this suite. Performance issues tenferro-rs #2000 (lanes x item-threads work model) and #1884 (batched LU thread scaling) are reported from these rows at 1T and 4T, with PyTorch as the reference.
  - family: eager_linalg_operation_spellings
    tenferro_apis:
      - EagerSessionLinalgExt::{svd,qr,lu,solve,cholesky,eigh,eig,triangular_solve,slogdet,det,inv,eigvalsh,eigvals,pinv,pinv_with_rtol,norm}
      - EagerTensorLinalgExt::solve
    pytorch: torch.linalg equivalents
    disposition: alias
    benchmarks: cpu/cpu_ops; cpu/linalg_uncovered
    reason: These borrowed-session eager methods (and the documented tensor-owned no_grad solve exception) dispatch the same measured linalg operations (kernel coverage only); lstsq and svd_full remain eager measurements because no concrete spelling exists.
  - family: full_svd
    tenferro_apis:
      - EagerSessionLinalgExt::svd_full
      - TracedTensorLinalgExt::svd_full
    pytorch: torch.linalg.svd(full_matrices=True)
    disposition: measured_or_provider_unsupported
    benchmarks: cpu/linalg_uncovered/svd_full
  - family: linalg_options
    tenferro_apis:
      - TensorLinalgExt::{svd_with_options,qr_with_options,eigh_with_options}
      - TensorReadLinalgExt::{svd_with_options_read,qr_with_options_read,eigh_with_options_read}
      - EagerSessionLinalgExt::{svd_with_options,qr_with_options,eigh_with_options}
      - TracedTensorLinalgExt::{svd_with_options,qr_with_options,eigh_with_options}
    pytorch: torch.linalg.{svd,qr,eigh}
    disposition: alias
    benchmarks: cpu/cpu_ops primal SVD/QR/Eigh rows
    reason: Default options lower to the measured operations; tenferro gauge controls have no direct PyTorch setting.
  - family: full_pivot_lu
    tenferro_apis:
      - TensorLinalgExt::{full_piv_lu,full_piv_lu_solve}
      - TensorReadLinalgExt::{full_piv_lu_read,full_piv_lu_solve_read}
      - EagerSessionLinalgExt::{full_piv_lu,full_piv_lu_solve}
      - TracedTensorLinalgExt::{full_piv_lu,full_piv_lu_solve}
    pytorch: null
    disposition: no_direct_pytorch
    reason: torch.linalg exposes partial-pivot LU but no full-pivot LU decomposition/solve.

  - family: automatic_differentiation
    tenferro_apis:
      - TracedTensorAdExt::{grad,jvp,vjp}
      - EagerTensor::{backward,grad}
    pytorch: torch.autograd; torch.func.{jvp,vjp}
    disposition: measured
    benchmarks: cpu/cpu_ops; cpu/linalg_jvp_vjp
  - family: optional_ad
    tenferro_apis:
      - TracedTensorAdExt::{grad_optional,jvp_optional,vjp_optional}
    pytorch: allow_unused/materialize_grads options
    disposition: alias
    benchmarks: cpu/cpu_ops; cpu/linalg_jvp_vjp
    reason: Optional variants only change disconnected-gradient handling; connected workloads execute the same transforms.
  - family: checkpoint
    tenferro_apis:
      - TracedTensorAdExt::checkpoint
    pytorch: torch.utils.checkpoint
    disposition: no_direct_timing_semantics
    reason: The APIs expose different lifetime and recomputation boundaries, so a one-call speed comparison would not be fair.

  - family: excluded_backend_infrastructure
    tenferro_apis:
      - TensorFusion
      - TensorBuffer
      - TensorDeviceTransfer
      - TensorBackendCapability
      - Runtime and GraphCompiler administration APIs
    pytorch: null
    disposition: out_of_scope
    reason: Backend/runtime infrastructure is not a numerical tensor operation with matching PyTorch call semantics.

# Public routes (tenferro-rs issue 1946 B1). Each route is one real public
# entrypoint with its route dimensions; it is covered only when every listed
# case executed and passed in the runs given to
# `scripts/route_coverage.py routes --runs <raw-run-dir>...`. A missing,
# failed, unsupported or unselected case leaves the route uncovered. Cases are
# `<suite_id>:<case_id>` or `<suite_id>:<case_id>[<provider>]`.
routes:
  - route_id: dot_read_batched_alloc
    entrypoint: TensorDot::dot_general_read
    dims: {execution_path: concrete, output: allocating, representation: owned, layout: direct, session_boundary: shared-session, provider: faer, policy: auto, threads: [1, 4]}
    cases: ["cpu/session_matrix:bdot_f64_b1024_m4n4k4_direct_alloc_auto[faer]"]
  - route_id: dot_read_batched_into
    entrypoint: TensorDot::dot_general_read_into
    dims: {execution_path: concrete, output: reused, representation: owned, layout: direct, session_boundary: shared-session, provider: faer, policy: auto, threads: [1, 4]}
    cases: ["cpu/session_matrix:bdot_f64_b1024_m4n4k4_direct_into_auto[faer]"]
  - route_id: dot_read_batched_canonical_copy
    entrypoint: TensorDot::dot_general_read
    dims: {execution_path: concrete, output: allocating, representation: view, layout: canonical-copy, session_boundary: shared-session, provider: faer, policy: auto}
    cases: ["cpu/session_matrix:bdot_f64_b1024_m4n4k4_canonical_alloc_auto[faer]", "cpu/session_matrix:bdot_f64_b1024_m4n4k4_canonical_into_auto[faer]"]
  - route_id: dot_read_batched_direct_strided
    entrypoint: TensorDot::dot_general_read
    dims: {execution_path: concrete, output: allocating, representation: view, layout: direct-strided, session_boundary: shared-session, provider: faer, policy: auto, coverage: full}
    cases: ["cpu/session_matrix:bdot_f64_b1024_m4n4k4_strided_alloc_auto[faer]", "cpu/session_matrix:bdot_f64_b1024_m4n4k4_strided_into_auto[faer]"]
  - route_id: dot_read_batched_complex
    entrypoint: TensorDot::dot_general_read
    dims: {execution_path: concrete, output: allocating, representation: owned, layout: direct, dtype: c64, session_boundary: shared-session, provider: faer, policy: auto, coverage: full}
    cases: ["cpu/session_matrix:bdot_c64_b1024_m4n4k4_direct_alloc_auto[faer]", "cpu/session_matrix:bdot_c64_b1024_m4n4k4_direct_into_auto[faer]"]
  - route_id: dot_read_loop_of_independent_calls
    entrypoint: TensorDot::dot_general_read
    dims: {execution_path: concrete, output: allocating, representation: owned, layout: direct, session_boundary: shared-session, provider: faer, workload: loop-of-1024-independent-ops}
    cases: ["cpu/session_matrix:matmul_n4_count1024[faer]"]
  - route_id: einsum_concrete_batched_alloc
    entrypoint: TensorEinsumExt::einsum
    dims: {execution_path: concrete-einsum, output: allocating, representation: owned, layout: direct, session_boundary: shared-session, provider: faer, policy: auto}
    cases: ["cpu/session_matrix:beinsum_f64_b1024_m4n4k4_direct_alloc_auto[faer]"]
  - route_id: einsum_concrete_batched_into
    entrypoint: TensorEinsumIntoExt::einsum_into
    dims: {execution_path: concrete-einsum, output: reused, representation: owned, layout: direct, session_boundary: shared-session, provider: faer, policy: auto}
    cases: ["cpu/session_matrix:beinsum_f64_b1024_m4n4k4_direct_into_auto[faer]"]
  - route_id: einsum_read_views_key_streams
    entrypoint: TensorReadEinsumExt::einsum_read
    dims: {execution_path: concrete-einsum, output: allocating, representation: view, layout: direct and direct-strided, session_boundary: shared-session, provider: faer, planning: inside timer}
    cases: ["cpu/session_matrix:stream_f64_fixed_len32_einsum_alloc[faer]", "cpu/session_matrix:stream_f64_mixed_len32_einsum_alloc[faer]", "cpu/session_matrix:stream_f64_fresh_len32_einsum_alloc[faer]", "cpu/session_matrix:stream_f64_strides_len32_einsum_alloc[faer]"]
  - route_id: hadamard_dot_vs_einsum
    entrypoint: TensorEinsumExt::einsum
    dims: {execution_path: concrete-einsum and concrete, output: allocating, representation: owned, layout: direct, session_boundary: shared-session, provider: faer}
    cases: ["cpu/session_matrix:hadamard_f64_m64n64_einsum_alloc[faer]", "cpu/session_matrix:hadamard_f64_m64n64_dot_alloc[faer]"]
  - route_id: einsum_multi_operand
    entrypoint: TensorEinsumExt::einsum
    dims: {execution_path: concrete-einsum, output: allocating, representation: owned, layout: direct, session_boundary: shared-session, provider: faer}
    cases: ["cpu/session_matrix:chain3_f64_n4_einsum_alloc[faer]"]
  - route_id: einsum_prepared_repeat
    entrypoint: ConcreteEinsumPlan::execute
    dims: {execution_path: concrete-prepared, output: allocating, representation: owned, session_boundary: shared-session}
    cases: ["cpu/small_work:einsum_f64_prepared-repeat_n4_single", "cpu/small_work:einsum_f64_prepared-repeat_abcd-dbef-acef_d4_single"]
  - route_id: einsum_prepared_into_repeat
    entrypoint: ConcreteEinsumPlan::execute_into
    dims: {execution_path: concrete-prepared, output: reused, representation: owned, session_boundary: shared-session}
    cases: ["cpu/small_work:einsum_f64_prepared-into-repeat_abcd-dbef-acef_d4_single"]
  - route_id: eager_session_einsum
    entrypoint: EagerSessionEinsumExt::einsum_subscripts
    dims: {execution_path: eager, output: allocating, representation: owned, session_boundary: session-per-call (diagnostic), coverage: full}
    cases: ["cpu/small_work:einsum_f64_eager-no-ad_n4_single"]
