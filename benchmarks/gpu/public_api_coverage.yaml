# Operation/route inventory for issue #155. Selections are not measured coverage.
schema_version: 1
issue: https://github.com/tensor4all/tenferro-benchmark/issues/155
audited_tenferro_commit: 8b13220c1e0397a29a27be65557c24105352a35b
measured_coverage_rule: Only validated status=ok rows in the linked latest reports count.
families:
  fft:
    cases: data/instances/gpu_fft.json
    suite: benchmarks/gpu/fft.yaml
    routes: [FftExecutor, EagerSessionFftExt]
    unsupported:
      TensorFftExt: One-shot plan construction cannot be hoisted outside standard timing.
      TensorReadFftExt: One-shot planning; noncontiguous read route is not an alias of FftExecutor.
      EagerTensorFftExt_in_place: CPU only at the audited revision.
  elementwise_reduction:
    cases: data/instances/gpu_isolated_ops.json
    suite: benchmarks/gpu/isolated_ops.yaml
    routes: [TensorSessionOpsExt, EagerSession]
    dtype_scope: F32/F64; C32/C64 materialized conjugation; Bool comparison/selection masks.
    limitations: Small direct compare cases pass numerical verification. Current GPU1 recheck 20261013_192206 reproduces Gt F32 within-process batch-time growth across three fresh processes; other directions share the allocation path but their drift is not asserted. See result/nvidia-gpu/gpu/compare_lifetime.md. Keep excluded pending issue 107 instrumentation; eager and large cases remain selected.
    selected_contracts:
      full_reductions: Full sum/prod/max/min/mean/sum-of-squares, F32/F64, n=1024 and 1048576; None axes in tenferro, omitted axis/dim in references. Full real sum-of-squares uses the single public vdot(x,x) reference; mean retains scalar-setup exclusions.
      scalar_scale: scale_real F32/F64/C32/C64 and scale_complex C32/C64 at n=1024 and 1048576. Direct outputs pass current CUDA checks but internal scalar uploads exclude timing. Eager scale creates a host scalar and CUDA execution fails; raw probe 20261013_200158 records this as unavailable. Framework references use one multiply with a preuploaded same-dtype scalar; ordinary Tensor.mul remains a distinct route.
      comparison_directions: Eq/Lt/Le/Gt/Ge with true, false and equality-boundary values; CompareDir has no Ne variant.
    latest_report: result/nvidia-gpu/gpu/isolated_ops.md; only validated measured cells count.
    measured_contracts: Full mean/sum-of-squares rows are in the latest GPU0 report; timing-excluded rows do not count as measured coverage.
    deferred:
      other_noncontiguous_reads: Transposed borrowed arithmetic, analytic functions, conjugation and sum/prod/max/min/sum-of-squares have independent cases under reuse_contraction. Comparison/select/clamp reads, offset/sliced layouts and additional dtype domains remain separate; none are blanket aliases.
  neural:
    cases: data/instances/gpu_nn.json
    suite: benchmarks/gpu/nn.yaml
    routes: [TensorSessionOpsExt, EagerSession]
    dtype_scope: F32/F64; finite inputs, axis=1, eps=1e-5; non-affine and weight-only/bias-only/weight-and-bias normalization.
    limitations: Per-arm internal scalar transfers and missing framework counterparts are recorded on every selected case.
    selected_contracts:
      affine_normalization: Layer/RMS weight-only, bias-only, and both at 32x32 and 1024x1024; independently varying GPU vectors. Torch layer_norm matches all variants; Torch rms_norm matches weight only. JAX single-call affine counterpart unverified. Tenferro paths pass full numeric checks but remain timing-excluded for internal scalar transfers.
    latest_report: result/nvidia-gpu/gpu/nn.md
    deferred:
      exceptional_mask_policy: All-masked/NaN/infinity semantics require separate correctness cases, not identical-input performance assumptions.
  structural:
    cases: data/instances/gpu_structural.json
    suite: benchmarks/gpu/structural.yaml
    routes: [TensorSessionOpsExt, EagerSession]
    contracts:
      padding: Edge/interior insertion, negative edge cropping, and combined interior/crop F32/F64 at 32x32 and 1024x1024. JAX lax.pad uses a preuploaded zero; PyTorch functional.pad compares cropping only and interior insertion is explicitly unsupported.
      scatter: Additive, unique in-bounds I64 indices; torch.scatter_add and lax.scatter_add.
      slice: Materialized direct slice; eager lazy view explicitly excluded from this comparison.
      take_along_axis: Shared-index and batch-varying-index routes are separate cases.
      cast: Explicit F32-to-F64 and F64-to-F32 materialization.
      convert: Checked lossless F32-to-F64 promotion, with matched framework conversions on that exact domain.
      broadcast: Materialized rank-two singleton broadcast; torch.expand_copy/JAX lax broadcast. Eager lazy output is not an equivalent materialization.
      dynamic_slice: I64 CUDA starts, two-dimensional half-sized windows, in-bounds and negative/high clamped starts. JAX scalar-start preparation is outside timing; PyTorch has no verified matching single API.
      gather: Unique in-bounds I64 row/column indices; configs prepared outside timing, torch.index_select and JAX lax.gather.
    existing_partial: [gpu/permutation, gpu/perf_issues]
    deferred:
      convert_other_dtype_domains: F32-to-F64 checked lossless promotion has selected cases; other domains require separate checked contracts.
      broadcast_other_mappings: Ordered rank-two singleton broadcasting has selected materializing direct/torch.expand_copy/JAX cases; eager lazy views are excluded. Other mappings remain separate.
      dynamic_slice_other_domains: F32/F64 with I64 CUDA starts now has in-bounds and clamped rank-two cases; other index dtype/rank domains remain separate.
      reshape: Existing perf_issues cases are partial coverage; an ordinary materialization/reference contract remains to be added.
      stack_index_select_slice_axis_take_axis: Map each public lowering before assigning operation aliases; wrapper latency is separate.
  linalg:
    cases: data/instances/gpu_linalg_public_api.json
    suite: benchmarks/gpu/linalg_public_api.yaml
    routes: [TensorLinalgExt, EagerSessionLinalgExt]
    existing_partial: [gpu/dense, gpu/linalg_jvp_vjp, gpu/linalg_ad_latency, gpu/perf_issues]
    contracts: F32/F64; owned compact inputs; values-only svdvals/eigvalsh; pinv rtol=1e-5; Frobenius norm; left/lower/non-unit triangular solve.
    deferred:
      svd_other_read_layouts: Full square/tall/wide F32/F64/C32/C64 outputs have verified cases, including full nullspace orthogonality; strided/read variants remain separate.
      slogdet_other_layouts: Both sign/log outputs have verified positive/negative/complex-phase cases; other layouts remain separate.
      householder_read_layouts: Compact construction has verified state-projection checks and Torch/JAX raw-QR references; other read layouts remain separate.
      lu_other_routes: Dynamic Tensor/EagerSession P/L/U/parity has selected square/tall/wide cases, with PA=LU and parity checked against independent SciPy pivots. Torch/JAX four-output single-call counterparts are unavailable. Borrowed reads and typed complex parity contracts remain separate.
      lstsq_other_domains: Selected full-column-rank tall solution-only EagerSession cases are maintained separately in benchmarks/gpu/lstsq.yaml. Internal QR scalar transfers exclude standard timing; no direct TensorLinalgExt lstsq or verified matching single-call framework solution-only contract. Square/batched domains remain separate; wide/rank-deficient inputs are outside the current eager API contract.
      rank_revealing_qr: No verified GPU-resident Q/R/P/rank reference; JAX pivoting can fall back to host LAPACK.
      HouseholderQr_state_other_options: from_factors/append_columns/r/prefix-and-complement q_columns now have independent verified cases. CUDA append/Q application uploads BLAS scalars internally and stays excluded from standard timing. Other gauge/driver options remain separate.
      driver_gauge_variants: Existing perf_issues driver cases are partial coverage; nondefault options are not default-operation aliases.
      TensorReadLinalgExt: Requires separately verified strided routes; known unsupported read hooks stay excluded.
  output_reuse_contraction:
    cases: data/instances/gpu_reuse_contraction.json
    suite: benchmarks/gpu/reuse_contraction.yaml
    routes: [TensorElementwise, TensorTensordotExt, EagerSessionEinsumExt, BackendSession]
    contracts: Preallocated output reuse is distinct from allocation-returning operations; JAX donation is not an equivalent arm.
    selected_contracts:
      strided_reads: Transposed rectangular 16x64/512x2048 borrowed add/sub/mul/div/rem/pow/maximum/minimum/neg/abs/sign/exp/expm1/log/log1p/erf/sin/cos/tanh/sqrt/rsqrt and axis-1 sum/prod/max/min/sum-of-squares F32/F64, plus materialized conj C32/C64. PyTorch uses a prepared transpose view; JAX compares the same logical values with native input representation, not a claimed strided-view contract.
      axpby_read_into_accum: Compact F32/F64/C32/C64; alpha/beta=(0.5,1),(0.5,0),(0.25,0.75),(1,1). Restore prepared GPU seeds before every batch. PyTorch add_, mul(out=), and lerp(out=) are matching single-call counterparts. Unit coefficients also select native JAX Ref.addupdate, with AOT scalar completion tokens and untimed full snapshots.
      dot_general_output_reuse: Square 16/256 F32/F64/C32/C64; overwrite and alpha=0.5/beta=1 accumulation, plus public SessionCachedDot accumulation with slot Some(0). PyTorch addmm with out is the matched reference. CUDA cached accumulation delegates to the ordinary accumulation hook; no separate cache-speed claim.
    deferred:
      other_generalized_conjugating_dot: Selected non-leading batch and multiple contraction axes have F32/F64/C32/C64 cases with native Torch bmm/tensordot and JAX lax.dot_general. Complex vectors cover all four conjugation flags; both-conjugated reference cells are unsupported. Additional read/layout/axis domains remain separate.
      dot_general_other_accumulation_layouts: Compact square overwrite/accumulation/cached-wrapper cases are selected; other alpha/beta values, batch/contract axes and borrowed strided reads need separate cases.
      axpby_other_beta_or_layout: Beta=0/1 and beta=1-alpha compact cases are selected; other independent alpha/beta combinations lack an established single-call reference. Strided sources internally upload coefficients and need a separate timing disposition. Ref.addupdate has no alpha parameter; scaled functional composition is not an equivalent arm.
      ConcreteEinsumPlan_other_equations: Prepared ik,kj->ij has selected owned/read/transposed-read execution, owned/read/strided output reuse and read/strided accumulation cases. Plan creation and input handles are untimed. Other equations, typed wrappers and multi-input plans remain separate.
      TensorEinsumIntoExt: No general PyTorch/JAX einsum caller-owned-output counterpart.
      complex_norm_squared: Real result dtype differs from complex vdot; do not equate contracts.
cross_cutting:
  trace: Runtime::run_prepared cannot borrow the entered session; per-call session setup is excluded from standard rows.
  metadata_views: transpose_view/reshape_view/slice_view/slice_axis_view/broadcast_in_dim_view do no GPU numerical work; classify separately.
  autodiff: Five existing scalar-loss JVP/VJP contracts now have independently verified F64 CUDA outputs and matched PyTorch/JAX JIT arms (n=2,4,8,256,512). Large trace timing excludes internal session setup; small trace rows explicitly measure public-path latency. New differentiated operation families remain separate coverage.
  runtime_transfer_lifecycle: Separate workflow/initialization diagnostics, tracked by issue 107 and perf_issues.
  legacy_jax_reports: >-
    Dense/einsum/chain select whole-operation JAX JIT; tensor-network additionally
    selects distinct prepared tree-kernel JIT and eager execution. Compact native
    layouts and recorded JIT compiler options pass full-size CUDA checks after
    earlier general-einsum/compiler-default OOMs. Framework timing, strict
    verification and held eager sessions are
    implemented; refreshed full-size GPU0 reports are linked under result/nvidia-gpu/gpu/.
cuda_unavailable_at_audit:
  - TensorLinalgExt inv/pinv_with_rtol (Latest fbd735ab F64 2x2 public Rust MWE confirms both internal host-scalar failures, reported upstream as #2147. Earlier dfbdf6b probe covered all eight F32/F64 32x32/512x512 cases. See result/nvidia-gpu/gpu/linalg_capability.md; eager routes differ)
  - eig/eigvals/full_piv_lu/full_piv_lu_solve
  - dynamic_update_slice
  - TensorReadLinalgExt solve_read/solve_read_into/triangular_solve_read/inv_read
  - SessionCachedDot grouped_gemm_cached (default requires host storage)
  - fused_activation_read (CUDA declines the optional hook; do not time Ok(None))
  - ext/sparse (host example, not a tenferro CUDA sparse implementation)
