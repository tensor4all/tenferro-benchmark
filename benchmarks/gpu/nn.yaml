schema_version: 1
suite_id: gpu/nn
title: CUDA public nn APIs
description: Isolated public APIs and explicit unsupported timing contracts. Issue 155.
defaults:
  device: {kind: cuda, ordinal: 0}
  run: {warmups: 3, runs: 15, min_runtime_ms: 2, timing_scope: steady_state_host_api_plus_device_sync}
  verify: {reference: numpy/scipy double precision, rtol: 0.0005, atol: 0.0005}
backends: [tenferro-cuda-direct, tenferro-cuda-eager, pytorch-cuda, jax-cuda, jax-cuda-jit]
problems:
  source: data/instances/gpu_nn.json
  include:
    - sigmoid_f32_n1024
    - sigmoid_f64_n1024
    - silu_f32_n1024
