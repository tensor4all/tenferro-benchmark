    seed: 34
  linalg_ad: &id001
    suite: large
    loss: grad_sum_svd_s
    n: 256
    matrix_seed: 34
  run:
    warmups: 3
    runs: 7
    timing_scope: steady_state_host_api_plus_device_sync
