  layout:
    tenferro: col_major
    framework: row_major_contiguous
  data:
    generator: well_conditioned
    seed: 34
  linalg_ad: &id001
    suite: large
    loss: grad_sum_svd_s
    n: 256
    matrix_seed: 34
  run:
    warmups: 3
    runs: 7
    timing_scope: steady_state_host_api_plus_device_sync
  verify:
    reference: cpu_fp64
    rtol: 1.0e-05
    atol: 1.0e-08
  notes: shape=256x256
