    - jax-cuda
    vendor_backends:
    - jax-cuda-jit
  gpu/isolated_ops:
    file: benchmarks/gpu/isolated_ops.yaml
    driver: gpu_public_api
    # One case per isolated elementwise/reduction operation (33), double or
    #     complex precision, large size; the 32-bit and 1k variants are sweeps.
