full_only_reasons:
  dense: 4096 solve, nearby solve/RHS variants and the 1024-matrix throughput batch stay in full; quick
    retains 512/2048 solve and the reported 16-matrix overhead regime.
  vendors: Broad vendor comparisons consumed substantial baseline process wall time; full retains them.
  sparse: Reference-only suite without tenferro CUDA implementation; baseline sparse section took about
    312 seconds.
  tensornetwork: Quick retains one complete-tree control with core backends. Node-JIT remains
    in full; the diagnostic eager JAX path is opt-in via GPU_BENCH_BACKENDS.
    Observed process walls about 55 seconds (node-JIT) and, for the opt-in eager
    path, about 235 seconds.
  einsum: Keep the 3072 matmul-shaped einsum in quick because its public einsum/planning dispatch differs
    from the direct dot route of dense matmul.
