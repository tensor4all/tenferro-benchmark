schema_version: 1
manifest_version: 2
issue: 107
# One curated routine set. There is no quick/full switch: every weekly run
# collects exactly this set, so changing it is a cost decision (see the table
# below and docs/gpu-routine-coverage.md).
#
# `problems` is always a subset of the suite file's own problem list; suites
# keep every case they ever had, so a dropped case comes back by naming it here
# again. `backends` is the routine arm set. `vendor_backends` are opt-in arms
# (BENCH_ROUTINE_VENDOR_ARMS=1, or an explicit GPU_BENCH_BACKENDS filter) and
# stay out of the weekly bundle; they are listed here so their cost stays
# visible next to the default arms.
#
# `driver` says which existing collector runs the suite; the default is the
# generic gpu_suite runner (scripts/benchmark_gpu_python.py and
# src/bin/benchmark_gpu_rust.rs). `gpu_linalg_ad` delegates to
# scripts/run_gpu_linalg_jvp_vjp.sh.
#
# | Suite                            | Driver          | Problems | Backends | Rows |
# |----------------------------------|-----------------|---------:|---------:|-----:|
# | gpu/dense                        | gpu_suite       |        7 |        4 |   28 |
# | gpu/einsum                       | gpu_suite       |        1 |        4 |    4 |
# | gpu/sparse                       | gpu_suite       |        2 |        1 |    2 |
# | gpu/tensornetwork                | gpu_suite       |        1 |        4 |    4 |
# | gpu/elementwise                  | gpu_suite       |        2 |        4 |    8 |
# | gpu/linalg_ad_latency            | gpu_linalg_ad   |       10 |        3 |   30 |
# | gpu/linalg_jvp_vjp               | gpu_linalg_ad   |       10 |        3 |   30 |
# | gpu/permutation                  | gpu_permutation |       10 |        6 |   44 |
# | gpu/lstsq                        | gpu_public_api  |        1 |        4 |    4 |
# | gpu/linalg_public_api_throughput | gpu_public_api  |       16 |        4 |   64 |
# | gpu/fft                          | gpu_public_api  |        4 |        4 |   16 |
# | gpu/nn                           | gpu_public_api  |       11 |        4 |   44 |
# | gpu/structural                   | gpu_public_api  |       16 |        4 |   64 |
# | gpu/isolated_ops                 | gpu_public_api  |       33 |        4 |  132 |
# | gpu/reuse_contraction            | gpu_public_api  |       56 |        4 |  224 |
# | Total                            |                 |      180 |       55 |  698 |
#
# Opt-in vendor arms add 164 rows: gpu/dense +21, gpu/einsum +2, gpu/sparse +4,
# and the second JAX path jax-cuda-jit on the seven public-API families +137,
# for an 862-row matrix. Rows are problem/backend pairs; each pair is one
# measured and numerically verified cell, and each backend is a separate
# process with its own startup and preparation.
#
# Order is deliberate: the weekly run collects the manifest in this order, so a
# night that runs out of budget loses the cheapest-signal-per-row tail last.
# The tail is gpu/isolated_ops and gpu/reuse_contraction (356 rows of per-op
# API surface). The first complete A100 run measures the real cost; if it does
# not fit one night, the documented fallback is to drop those two from this
# manifest and collect them monthly (a manifest edit, not a code path). They
# are in the weekly set until that measurement says otherwise.
suites:
  gpu/dense:
    file: benchmarks/gpu/dense.yaml
    # One representative per operation family: matmul, batched_matmul, qr,
    # solve, svd, eigh. The solve size ladder (512/1024/4096 and the rhs128
    # variant) stays in the suite file; a size sweep characterizes the curve, it
    # is not needed weekly.
    # dense_batched_matmul_f64_b16_32 is the only latency-regime representative
    # of this family, so it is a second mechanism, not a second size.
    problems:
    - dense_matmul_f64_3072
    - dense_batched_matmul_f64_b1024_256
    - dense_qr_f64_1536
    - dense_solve_f64_2048_rhs16
    - dense_svd_f64_256
    - dense_eigh_f64_1024
    - dense_batched_matmul_f64_b16_32
    backends:
    - tenferro-cuda-trace
    - tenferro-cuda-eager
    - pytorch-cuda
    - jax-cuda
    vendor_backends:
    - cublaslt
    - cutlass
    - cusolver
  gpu/einsum:
    file: benchmarks/gpu/einsum.yaml
    # The single einsum case exercises the public einsum/planning dispatch,
    # which differs from the direct dot route of dense matmul.
    problems:
    - einsum_bin_matmul_3072_f64
    backends:
    - tenferro-cuda-trace
    - tenferro-cuda-eager
    - pytorch-cuda
    - jax-cuda
    vendor_backends:
    - cublaslt
    - cutlass
  gpu/sparse:
    file: benchmarks/gpu/sparse.yaml
    # Reference-only suite: tenferro has no CUDA sparse implementation, so only
    # the PyTorch reference arm is routine. cusparse and ginkgo are the opt-in
    # vendor arms.
    problems:
    - sparse_synthetic_4m_64m_spmv_f64
    - sparse_synthetic_64k_4m_spmm_f64_rhs1024
    backends:
    - pytorch-cuda
    vendor_backends:
    - cusparse
    - ginkgo
  gpu/tensornetwork:
    file: benchmarks/gpu/tensornetwork.yaml
    # One complete-tree control. Node-JIT is the compiled reference; the
    # diagnostic eager JAX path stays opt-in via GPU_BENCH_BACKENDS.
    problems:
    - tensornetwork_permutation_optimized_f32
    backends:
    - tenferro-cuda-trace
    - tenferro-cuda-eager
    - pytorch-cuda
    - jax-cuda-tree-jit
  gpu/elementwise:
    file: benchmarks/gpu/elementwise.yaml
    # Both cases stay: they are different regimes of the same operation, not a
    # size sweep. 1k measures per-command overhead (latency), 1m measures the
    # bandwidth cost, and the two are never averaged together.
    problems:
    - elementwise_chain_f64_1k
    - elementwise_chain_f64_1m
    backends:
    - tenferro-cuda-trace
    - tenferro-cuda-eager
    - pytorch-cuda
    - jax-cuda
  gpu/linalg_ad_latency:
    file: benchmarks/gpu/linalg_ad_latency.yaml
    driver: gpu_linalg_ad
    # n=4 only (10 operations x 1 size). These rows measure call overhead,
    # which barely depends on size, so one size keeps regression detection and
    # drops the n=2/8 characterization sweep.
    problems:
    - linalg_ad_small_grad_sum_svd_s_jvp_f64_4
    - linalg_ad_small_grad_sum_svd_s_vjp_f64_4
    - linalg_ad_small_grad_sum_qr_jvp_f64_4
    - linalg_ad_small_grad_sum_qr_vjp_f64_4
    - linalg_ad_small_grad_sum_eigh_jvp_f64_4
    - linalg_ad_small_grad_sum_eigh_vjp_f64_4
    - linalg_ad_small_grad_sum_lu_jvp_f64_4
    - linalg_ad_small_grad_sum_lu_vjp_f64_4
    - linalg_ad_small_grad_sum_solve_jvp_f64_4
    - linalg_ad_small_grad_sum_solve_vjp_f64_4
    backends:
    - tenferro-cuda-trace
    - pytorch-cuda
    - jax-cuda
  gpu/linalg_jvp_vjp:
    file: benchmarks/gpu/linalg_jvp_vjp.yaml
    driver: gpu_linalg_ad
    # n=256 only (10 operations x 1 size). The n=4096 rows are the throughput
    # end of the same AD workloads (a per-call 4096 case is ~100 ms-3.5 s of
    # GPU work before its check); one size detects regressions and keeps the
    # weekly AD cost bounded, so the 4096 rows are run on an explicit probe.
    problems:
    - linalg_ad_large_grad_sum_svd_s_jvp_f64_256
    - linalg_ad_large_grad_sum_svd_s_vjp_f64_256
    - linalg_ad_large_grad_sum_qr_jvp_f64_256
    - linalg_ad_large_grad_sum_qr_vjp_f64_256
    - linalg_ad_large_grad_sum_eigh_jvp_f64_256
    - linalg_ad_large_grad_sum_eigh_vjp_f64_256
    - linalg_ad_large_grad_sum_lu_jvp_f64_256
    - linalg_ad_large_grad_sum_lu_vjp_f64_256
    - linalg_ad_large_grad_sum_solve_jvp_f64_256
    - linalg_ad_large_grad_sum_solve_vjp_f64_256
    backends:
    - tenferro-cuda-trace
    - pytorch-cuda
    - jax-cuda
  gpu/permutation:
    file: benchmarks/gpu/permutation.yaml
    driver: gpu_permutation
    # All ten patterns: the materialize kernel sits under every contraction, and
    #     this suite's 44 rows once went three weeks without an update. Every pattern
    #     is a different index mapping, not a size sweep, so none is dropped.
    #     Its arms are fixed by the two permutation runners (no arm filter exists
    #     there); cuTENSOR is one of them because comparing the materialize kernel
    #     against it is the suite's purpose.
    problems:
    - memcpy_24d_64x2
    - transpose_2d_32768_16384
    - transpose_3d_1024_1024_512_201
    - transpose_3d_1024_1024_512_102
    - rotation_6d_64_32_32_32_16_16
    - reverse_23d_128x2
    - reverse_18d_3
    - cyclic_18d_3
    - tn_light_415_24d_scattered_to_colmajor_gpu
    - tn_light_415_24d_contiguous_same_perm_gpu
    backends:
    - tenferro-cuda-transpose
    - tenferro-cuda-to-contiguous
    - tenferro-cuda-destination-reuse
    - cutensor
    - pytorch-cuda
    - memcpy-d2d
  gpu/lstsq:
    file: benchmarks/gpu/lstsq.yaml
    driver: gpu_public_api
    # The public least-squares surface keeps its one operation at the larger system
    #     size in double precision; the f32/complex and small-system variants are
    #     precision/size sweeps. This is the suite that carries the unresolved #299
    #     failures, so it must be measured weekly rather than on request.
    problems:
    - lstsq_tall_f64_s256_rhs8
    backends:
    - tenferro-cuda-direct
    - tenferro-cuda-eager
    - pytorch-cuda
    - jax-cuda
    vendor_backends:
    - jax-cuda-jit
  gpu/linalg_public_api_throughput:
    file: benchmarks/gpu/linalg_public_api_throughput.yaml
    driver: gpu_public_api
    # One case per public linalg operation (16), double or complex precision, the
    #     largest declared shape. Factorization/Factor scheduling variants of the same
    #     operation were already collapsed per op; dtype and size sweeps are not
    #     weekly. This is the surface where #299-class failures appear. Every case
    #     here is in the throughput shape class (largest dimension >= 256), so the
    #     per-call overhead page gpu/linalg_public_api_latency is not in this set.
    problems:
    - cholesky_f64_512x512
    - svdvals_f64_512x512
    - eigvalsh_f64_512x512
    - pinv_f64_512x512
    - inv_f64_512x512
    - det_f64_512x512
    - norm_f64_512x512
    - triangular_solve_f64_512x512
    - svd_full_tall_f64_512x256
    - slogdet_positive_f64_256x256
    - householder_qr_tall_f64_512x256
    - householder_from_factors_default_f64_512x256
    - householder_append_default_f64_512x256
    - householder_r_default_f64_512x256
    - householder_q_columns_prefix_f64_512x256
    - lu_tall_f64_s256
    backends:
    - tenferro-cuda-direct
    - tenferro-cuda-eager
    - pytorch-cuda
    - jax-cuda
    vendor_backends:
    - jax-cuda-jit
  gpu/fft:
    file: benchmarks/gpu/fft.yaml
    driver: gpu_public_api
    # The four public transforms once each, double precision and the large size;
    #     f32 and the 1k size are precision/size sweeps.
    problems:
    - fft_c64_n1048576
    - ifft_c64_n1048576
    - rfft_f64_n1048576
    - irfft_c64_n1048576
    backends:
    - tenferro-cuda-direct
    - tenferro-cuda-eager
    - pytorch-cuda
    - jax-cuda
    vendor_backends:
    - jax-cuda-jit
  gpu/nn:
    file: benchmarks/gpu/nn.yaml
    driver: gpu_public_api
    # One case per activation/normalization/softmax operation (11), double
    #     precision, large size; f32 and the 1k size are sweeps.
    problems:
    - sigmoid_f64_n1048576
    - silu_f64_n1048576
    - softplus_f64_n1048576
    - gelu_f64_n1048576
    - gelu_tanh_f64_n1048576
