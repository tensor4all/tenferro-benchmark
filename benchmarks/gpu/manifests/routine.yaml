  gpu/structural:
    file: benchmarks/gpu/structural.yaml
    driver: gpu_public_api
    # One case per structural operation (16 of 17; embed_diag only declares the
    #     small size), double precision, the largest declared size. Integer and
    #     complex/32-bit variants are dtype sweeps.
    problems:
    - pad_default_f64_n1048576
    - slice_default_f64_n1048576
    - reverse_default_f64_n1048576
    - concatenate_default_f64_n1048576
    - extract_diag_default_f64_n1048576
    - embed_diag_default_f64_n1024
    - tril_default_f64_n1048576
    - triu_default_f64_n1048576
    - take_along_axis_broadcast_indices_f64_n1048576
    - scatter_default_f64_n1048576
