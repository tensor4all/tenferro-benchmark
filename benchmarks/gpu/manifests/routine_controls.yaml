# One control set. These are the public-API latency/state controls the routine
# command has always collected weekly; there is no quick/full switch, so the
# list below is the whole routine control lane.
#
# The mechanisms: three whole-sequence cache modes (fixed-key warm, bounded
# mixed-key, fresh-key) at two sequence lengths, allocation-free kernels through
# one shared callback versus per-call callback entry at two sizes for the timed
# lane, and repeated backend construction for the untimed state lane.
#
# The wider `gpu/perf_issues` variants (capacity-thrash and
# equal-shape/different-stride streams, every zero-allocation size and the
# host-zero-upload reference arms) stay in the instance data, so widening this
# set is a manifest edit and a cost decision, not a code change.
