schema_version: 1
suite_id: gpu/linalg_public_api_latency
title: CUDA public linalg APIs, per-call latency and launch overhead
description: >-
  Small-shape view of the same CUDA public linalg API surface: the 82 cases
  whose largest matrix dimension is at most 128. `small` is a shape class, not a
  measured classification: device kernel time is a small fraction of each
  measurement here, so these rows are per-call launch and synchronization
  overhead diagnostics rather than GPU throughput. They are never comparable
  with, or averaged together with, the large-shape rows of
  `gpu/linalg_public_api_throughput` (tenferro-rs #2087). Issue 155. Rows here
  are lower than on pages published before this harness change because the
  harness used to open the CUDA engine once per case inside the timed region and
  now opens it once per arm, so the difference is removed harness cost and not a
  change in the kernels.
defaults:
  # latency: the 32x32..64x32 shape class.
  regime: latency
  device: {kind: cuda, ordinal: 0}
  run: {warmups: 3, runs: 15, min_runtime_ms: 2, timing_scope: steady_state_host_api_plus_device_sync}
  verify: {reference: numpy/scipy double precision, rtol: 0.0005, atol: 0.0005}
backends: [tenferro-cuda-direct, tenferro-cuda-eager, pytorch-cuda, jax-cuda, jax-cuda-jit]
problems:
  # One case source for both shape classes: the include list below is the only
  # difference between this suite and its sibling, so the two pages hold the
  # same problems, protocol and backends split by matrix size.
  source: data/instances/gpu_linalg_public_api.json
