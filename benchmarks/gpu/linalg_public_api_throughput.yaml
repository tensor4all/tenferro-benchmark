schema_version: 1
suite_id: gpu/linalg_public_api_throughput
title: CUDA public linalg APIs, throughput view (read this one first)
description: >-
  Large-shape view of the CUDA public linalg API surface: the 82 cases whose
  largest matrix dimension is at least 256. `large` is a shape class, not a
  measured classification: no row is asserted to be compute- or bandwidth-bound,
  and a memory-bound row takes the same time here as at a small shape
  (`householder_r_default_f32` measured 34.698 µs at 512x256 and 35.223 µs at
  64x32). These rows are never comparable with, or averaged together with, the
  per-call overhead rows of `gpu/linalg_public_api_latency` (tenferro-rs #2087).
  Rows here are lower than on pages published before this harness change because
  the harness used to open the CUDA engine once per case inside the timed region
  and now opens it once per arm, so the difference is removed harness cost and
  not a change in the kernels.
  The same problems, protocol and backends are split by shape class between the
  two suites. Issue 155.
defaults:
  # throughput: the 256..512 shape class.
  regime: throughput
  device: {kind: cuda, ordinal: 0}
  run: {warmups: 3, runs: 15, min_runtime_ms: 2, timing_scope: steady_state_host_api_plus_device_sync}
  verify: {reference: numpy/scipy double precision, rtol: 0.0005, atol: 0.0005}
backends: [tenferro-cuda-direct, tenferro-cuda-eager, pytorch-cuda, jax-cuda, jax-cuda-jit]
problems:
  # One case source for both shape classes: the include list below is the only
  # difference between this suite and its sibling, so the two pages hold the
  # same problems, protocol and backends split by matrix size.
