# Published cells withdrawn from a recorded run.
#
# A cell is withdrawn when the run record it came from is intact but the number
# does not measure what its column says (a harness defect found after
# collection), and a corrected re-measurement shows that the published
# difference is not evidence. The run directory is never edited: the page
# generators (`scripts/withdrawn_cells.py`, used by `format_cpu_ops_results.py`
# and `format_linalg_ad_results.py`) read this file and render the cell as
# `withdrawn`, with its reason, instead of the recorded median. So
# `regenerate_report_summaries.py --check` re-derives the same bytes from the
# same run plus this file.
#
# Key: `run` is the run directory relative to `data/results/`; `benchmark`,
# `threads`, `shape`, `backend` are the CSV row's values (backend after
# normalization). `reason` is printed on the page and in the summary row;
# `evidence` is the tracked record of the re-measurement behind it.
cells:
  - run: zen5-cpu/cpu/einsum/20261124_131021
    benchmark: grad_sum_svd_s_vjp
    dtype: f64
    threads: 4
    shape: 256x256
    backend: tenferro-eager
    ref: "tenferro-benchmark#517"
    evidence: data/withdrawals/zen5-cpu/517_eager_vjp_single_pass/20261124T113942Z
    reason: >-
      timed a second forward pass after the VJP (harness defect from the
      tenferro-rs 0.12 migration, 03f0f80); re-measured single-pass at the same pin: 18.905 ms
      (between-start SD 0.103, W 0.210) vs 18.817 ± 0.075 at 9a850b06, a 0.47 %
      difference inside W, so the two revisions are not distinguishable here
  - run: zen5-cpu/cpu/einsum/20261124_131021
    benchmark: grad_sum_eigh_vjp
    dtype: f64
    threads: 4
    shape: 256x256
    backend: tenferro-eager
    ref: "tenferro-benchmark#517"
    evidence: data/withdrawals/zen5-cpu/517_eager_vjp_single_pass/20261124T113942Z
    reason: >-
      timed a second forward pass after the VJP (harness defect from the
      tenferro-rs 0.12 migration, 03f0f80); re-measured single-pass at the same pin: 10.228 ms
      (between-start SD 0.060, W 0.078) vs 10.416 ± 0.032 at 9a850b06, 1.8 %
      faster, so the published 1.92x slowdown does not exist
