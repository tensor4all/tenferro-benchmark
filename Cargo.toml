[package]
name = "tenferro-einsum-benchmark"
version = "0.1.0"
edition = "2021"
description = "Benchmark suite for tenferro-einsum based on einsum benchmark"
build = "build.rs"

[dependencies]
tenferro-ad       = { path = "extern/tenferro-rs/crates/tenferro-ad", default-features = false }
tenferro-einsum   = { path = "extern/tenferro-rs/crates/tenferro-einsum", default-features = false }
tenferro-fft      = { path = "extern/tenferro-rs/crates/tenferro-fft", default-features = false }
tenferro-linalg   = { path = "extern/tenferro-rs/crates/tenferro-linalg", default-features = false }
tenferro-runtime  = { path = "extern/tenferro-rs/crates/tenferro-runtime", default-features = false }
tenferro-tensor   = { path = "extern/tenferro-rs/crates/tenferro-tensor", default-features = false }
tenferro-gpu      = { path = "extern/tenferro-rs/crates/tenferro-gpu", default-features = false, optional = true }
tenferro-cpu      = { path = "extern/tenferro-rs/crates/tenferro-cpu", default-features = false, optional = true }
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
hptt = { version = "0.4.1", optional = true }
# dlopen the vendor cuTENSOR library for the `cutensor` participant in
# benchmark_gpu_permutation (gpu/permutation suite). tenferro-gpu's own
# cuTENSOR FFI bindings only cover contraction (dot_general); permutation is
# bound directly in this benchmark repo, mirroring
# extern/tenferro-rs/crates/tenferro-gpu/src/cubecl/ffi/cutensor.rs's dlopen
# style. Optional, only pulled in by the `cuda` feature.
libloading = { version = "0.8", optional = true }
# cudarc reference arms of the gpu/perf_issues transfer cases (tenferro-rs
# #2009): pageable and pinned memcpy on the same device. Same version and
# feature set as tenferro-rs's workspace pin, so Cargo resolves one copy.
cudarc = { version = "0.19", optional = true, default-features = false, features = ["driver", "runtime", "nvrtc", "dynamic-loading", "cuda-12080"] }
# Non-optional: benchmark_permutation always reports the actual size of
# tenferro's global rayon pool (rayon::current_num_threads(), sized from
# RAYON_NUM_THREADS at process start) as its `threads` field, regardless of
# any Cargo feature.
rayon = "1"
# Reference arms of the cpu/perf_issues decode-projection cases (tenferro-rs
# #1992/#2003/#1995): the identical GEMM through faer directly into a
# preallocated output, and a plain host sgemm. faer matches tenferro-rs's own
# faer requirement so Cargo resolves one copy.
faer = { version = "0.24", default-features = false, features = ["std", "rayon"] }
matrixmultiply = { version = "0.3", features = ["threading"] }
# f64 erf reference for the cpu/perf_issues erf / exact-gelu checks (tenferro-rs
# #1975, #2010 PR-B1); the same crate tenferro-cpu evaluates erf with.
libm = "0.2"
# Optional path deps on extern/strided-rs (see scripts/setup_extern_deps.sh,
# which clones it alongside extern/tenferro-rs), gated by the `strided-rs`
# feature below. Cargo resolves every path dependency's manifest to build the
# unit graph even when the feature enabling it is off, so a checkout without
# extern/strided-rs would fail `cargo build` outright regardless of
# `--features strided-rs`; that is why setup_extern_deps.sh fetches it
# unconditionally, the same as extern/tenferro-rs.
strided-perm = { path = "extern/strided-rs/strided-perm", default-features = false, optional = true }
strided-view = { path = "extern/strided-rs/strided-view", optional = true }

[features]
default = ["native"]
# Gates the `hptt` participant in benchmark_permutation (cpu/permutation
# suite). Builds the vendored HPTT C++ library via the `hptt` crate's cmake
# build script; requires cmake and a C++ toolchain. Verified with
# `cargo check --features hptt` / `cargo build --release --features hptt` on
# both macOS (cmake installed via Homebrew, e.g. `brew install cmake`) and
# Linux; not Linux-only. If the vendored HPTT CMakeLists ever rejects a newer
# cmake (cmake >= 4 dropped compatibility with `cmake_minimum_required`
# versions below 3.5), set `CMAKE_POLICY_VERSION_MINIMUM=3.5` in the
# environment before building.
hptt = ["dep:hptt"]
# Gates the `strided-rs` participant in benchmark_permutation (cpu/permutation
# suite): strided_perm::copy_into / copy_into_col_major materializing a
# strided view built directly from the pattern's source strides, using
# extern/strided-rs's strided-perm + strided-view crates (cloned by
# scripts/setup_extern_deps.sh, mirroring how extern/tenferro-rs is fetched).
# Also enables strided-perm's own `parallel` feature (copy_into_par /
# copy_into_col_major_par) so 4-thread runs exercise strided-perm's rayon
# path, matching this repo's other rayon-backed backends.
strided-rs = ["dep:strided-perm", "dep:strided-view", "strided-perm/parallel"]
# CPU backend selection (tenferro-rs #2004): a build compiles exactly one of
# `native` (tenferro's own faer kernels and thread pool) or `blas` (cpueinsum
# contractions plus tlinalg linear algebra on a vendor BLAS/LAPACK); enabling
# both is a build error upstream.
#
# The vendor features select upstream's provider-neutral `blas` feature and link
# the installed vendor library from this build instead (build.rs with
# OPENBLAS_ROOT / MKLROOT, or the Accelerate framework), so a run measures the
# same installed provider as the reference Python stacks. Upstream's
# provider-src features would build and link their own copy of the library,
# which is not the comparison this harness reports.
native = [
    "tenferro-ad/native",
    "tenferro-einsum/autodiff",
    "tenferro-einsum/native",
    "tenferro-fft/autodiff",
    "tenferro-fft/native",
    "tenferro-linalg/autodiff",
    "tenferro-linalg/native",
    "tenferro-runtime/native",
    "dep:tenferro-cpu",
    "tenferro-cpu?/native",
]
# Shared base of the three supported BLAS selections below. On its own it has no
# provider link contract, so it is not a supported standalone selection.
blas = [
    "tenferro-ad/blas",
    "tenferro-einsum/autodiff",
    "tenferro-einsum/blas",
    "tenferro-fft/autodiff",
    "tenferro-fft/blas",
    "tenferro-linalg/autodiff",
    "tenferro-linalg/blas",
    "tenferro-runtime/blas",
    "dep:tenferro-cpu",
    "tenferro-cpu?/blas",
]
blas-openblas = ["blas"]
blas-accelerate = ["blas"]
blas-mkl = ["blas"]
cuda = [
    "tenferro-fft/cuda",
    "tenferro-ad/cuda",
    "tenferro-einsum/cuda",
    "tenferro-einsum/autodiff",
    "tenferro-linalg/cuda",
    "tenferro-linalg/autodiff",
    "dep:tenferro-gpu",
    "tenferro-gpu?/cuda",
    "dep:tenferro-cpu",
    "tenferro-cpu?/native",
    "dep:libloading",
    "dep:cudarc",
]
webgpu = [
    "dep:tenferro-gpu",
    "tenferro-gpu?/webgpu",
    "dep:tenferro-cpu",
    "tenferro-cpu?/native",
]

[[bin]]
name = "publication_gate"
path = "src/bin/publication_gate.rs"

[[bin]]
name = "benchmark_permutation"
path = "src/bin/benchmark_permutation.rs"

[[bin]]
name = "benchmark_cpu_fft"
path = "src/bin/benchmark_cpu_fft.rs"

[[bin]]
name = "benchmark_cpu_public_api"
path = "src/bin/benchmark_cpu_public_api.rs"

[[bin]]
name = "benchmark_gpu_rust"
path = "src/bin/benchmark_gpu_rust.rs"
required-features = ["cuda"]

[[bin]]
name = "benchmark_gpu_perf_issues"
path = "src/bin/benchmark_gpu_perf_issues.rs"
required-features = ["cuda"]

[[bin]]
name = "benchmark_gpu_linalg_ad"
path = "src/bin/benchmark_gpu_linalg_ad.rs"
required-features = ["cuda"]

[[bin]]
name = "benchmark_gpu_permutation"
path = "src/bin/benchmark_gpu_permutation.rs"
required-features = ["cuda"]

[[bin]]
name = "benchmark_gpu_permutation_webgpu"
path = "src/bin/benchmark_gpu_permutation_webgpu.rs"
required-features = ["webgpu"]
