name: publish-results

on:
  push:
    branches: [main]
    paths:
      - 'result/**'
      - 'scripts/generate_dashboard.py'
      - 'scripts/report_summary.py'
      - 'scripts/dashboard-requirements.txt'
      - 'benchmarks/**'
      - 'data/instances/**'
      - '.github/workflows/publish-results.yml'
  repository_dispatch:
    types: [benchmark-results-ingested]
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-results-pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: github.repository == 'tensor4all/tenferro-benchmark'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout committed benchmark results
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Generate dashboard from repository only
        run: |
          uv run --no-project --python 3.12 --with-requirements scripts/dashboard-requirements.txt \
            python scripts/generate_dashboard.py --result-dir result --output-dir _site --git-repo .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.repository == 'tensor4all/tenferro-benchmark'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
