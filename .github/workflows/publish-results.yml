name: publish-results

on:
  push:
    branches: [main]
    paths:
      - 'result/**'
      - 'scripts/generate_dashboard.py'
      - 'scripts/generate_history.py'
      - 'scripts/trend_points.py'
      - 'scripts/report_summary.py'
      - 'scripts/dashboard-requirements.txt'
      - 'benchmarks/**'
      - 'data/instances/**'
      - '.github/workflows/publish-results.yml'
  repository_dispatch:
    types: [benchmark-results-ingested]
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-results-pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: github.repository == 'tensor4all/tenferro-benchmark'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout committed benchmark results
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          # history.html reads the publication commits, and the dashboard reads
          # the previous summaries, from git history.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Export trend points and render the trend chart
        # The points come from the published summary sidecars in git history and are
        # drawn by the toolkit's trend renderer; nothing is committed. The CPU family
        # page embeds the charts the step below generates.
        run: |
          uv run --no-project --python 3.12 --with-requirements scripts/dashboard-requirements.txt \
            python scripts/trend_points.py --out _site/trend/points.json --render _site/trend

      - name: Generate the landing page, suite pages and history page
        # Generated on every deploy from the committed result/ tree and git history;
        # none of it is committed (_site/ is git-ignored). Only the latest hardware
        # generation (LATEST_PROFILES in scripts/generate_dashboard.py) is published
        # or linked, so the top page cannot show stale data or point at old hardware.
        run: |
          uv run --no-project --python 3.12 --with-requirements scripts/dashboard-requirements.txt \
            python scripts/generate_dashboard.py --result-dir result --output-dir _site --git-repo .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.repository == 'tensor4all/tenferro-benchmark'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
