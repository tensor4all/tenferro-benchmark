name: benchmark-nightly-linux-cpu

on:
  schedule:
    # 02:47 JST (17:47 UTC) every day.
    - cron: "47 17 * * *"
  workflow_dispatch:
    inputs:
      tenferro_ref:
        description: "tenferro-rs ref to benchmark (default: latest main; pinned once per run)"
        required: false
        default: ""

# This workflow uses a GitHub-hosted runner, so results are reference-quality
# indicators only. Canonical regression tracking still requires a stable
# dedicated self-hosted runner with MKL. Collection uses the maintained MKL
# devcontainer to match the PyTorch wheel BLAS provider.
permissions:
  contents: read

concurrency:
  group: benchmark-linux-cpu-canonical
  cancel-in-progress: false

jobs:
  linux-cpu:
    if: github.repository == 'tensor4all/tenferro-benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout benchmark harness
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install devcontainer CLI
        run: npm install --global @devcontainers/cli

      - name: Create current MKL CPU devcontainer
        run: devcontainer up --workspace-folder . --remove-existing-container

      - name: Run sequential Linux CPU suites in MKL devcontainer
        env:
          TENFERRO_REF: ${{ inputs.tenferro_ref || 'main' }}
        run: |
          # shellcheck disable=SC2016
          collection_script=$(cat <<'SCRIPT'
            set -euo pipefail
            trap 'echo "CPU collection failed at line $LINENO: $BASH_COMMAND" >&2' ERR
            test -d "$MKLROOT"
            export TENFERRO_CPU_FEATURES=blas-mkl
            export PUBLICATION_GATE_FEATURES=blas-mkl
            export BENCHMARK_TARGET_PROFILE=amd-cpu
            export PUBLICATION_GATE_PROFILE=quick
            export BENCHMARK_ALLOW_BUSY_HOST=1
            export PERMUTATION_EXTRA_FEATURES=hptt
            uv sync --frozen || uv sync
            TENFERRO_UPDATE=1 ./scripts/setup_extern_deps.sh
            export TENFERRO_REF="$(git -C extern/tenferro-rs rev-parse HEAD)"
            export TENFERRO_UPDATE=0
            # All suites inherit this detached revision and execute sequentially.
            # run_all already runs permutation once over both thread counts.
            ./scripts/run_all.sh 1 4
          SCRIPT
          )
          devcontainer exec --workspace-folder . env TENFERRO_REF="$TENFERRO_REF" bash -lc "$collection_script"

      - name: Install uv for result packaging
        uses: astral-sh/setup-uv@v3

      - name: Package this collection's CPU results
        run: |
          uv run --no-project --with pyyaml --with jsonschema python scripts/ci/bundle_cpu_results.py \
            --profile amd-cpu --harness-commit "$GITHUB_SHA" --threads 1 4

      - name: Archive validated raw bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-cpu-benchmark-results-${{ github.run_id }}
          path: _cpu_benchmark_artifact/
          if-no-files-found: error
          retention-days: 90

      - name: Archive failed collection diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-cpu-benchmark-diagnostics-${{ github.run_id }}
          path: |
            data/results/amd-cpu
            result/amd-cpu
            _cpu_benchmark_artifact/
          retention-days: 90
