name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'tensor4all/tenferro-benchmark'
    runs-on: ubuntu-latest
    env:
      OPENBLAS_ROOT: /usr
      # Validate the recorded compatible revision: the tenferro-rs commit this
      # harness now builds against (#2004 CPU boundary integration, PR #2026).
      # Latest upstream main is exercised separately by
      # benchmark-smoke-tenferro-main / nightly jobs.
      TENFERRO_REF: b3f47296244ff7b7c55ac0a75f782cb0835418c1
      TENFERRO_UPDATE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          # Track the latest stable Julia 1.x (matching the release channel used
          # for the recorded results and the committed Manifest.toml).
          version: "1"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev libomp-dev cmake build-essential

      - name: Prepare Python environment
        run: uv sync --frozen || uv sync

      - name: Setup external dependencies
        run: ./scripts/setup_extern_deps.sh

      - name: Test RunPod provisioning without paid resources
        run: uv run python -m unittest discover -s scripts/ci/tests -p 'test_*.py'

      - name: Validate benchmark suite YAML files
        run: |
          uv run python scripts/validate_benchmark_suite.py \
            benchmarks/cpu/einsum.yaml \
            benchmarks/cpu/public_api.yaml \
            benchmarks/cpu/fft.yaml \
            benchmarks/cpu/permutation.yaml \
            benchmarks/cpu/cpu_ops.yaml \
            benchmarks/cpu/session_matrix.yaml \
            benchmarks/cpu/small_work.yaml \
            benchmarks/cpu/perf_issues.yaml \
            benchmarks/gpu/dense.yaml \
            benchmarks/gpu/einsum.yaml \
            benchmarks/gpu/sparse.yaml \
            benchmarks/gpu/linalg_jvp_vjp.yaml \
            benchmarks/gpu/linalg_ad_latency.yaml \
            benchmarks/gpu/elementwise.yaml \
            benchmarks/gpu/perf_issues.yaml

      - name: Check Python scripts compile
        run: |
          uv run python -m py_compile \
            scripts/generate_results_index.py \
            scripts/validate_benchmark_suite.py \
            scripts/collect_run_metadata.py \
            scripts/format_results.py

      - name: Run layout validation test
        run: bash tests/test_suite_result_layout.sh

      - name: Cargo check
        run: cargo check --all-targets
