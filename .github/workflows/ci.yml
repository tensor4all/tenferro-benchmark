name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'tensor4all/tenferro-benchmark'
    runs-on: ubuntu-latest
    env:
      OPENBLAS_ROOT: /usr
      # setup_extern_deps.sh checks out the pinned revision
      # (pins/tenferro-rs.rev). Latest upstream main is exercised separately by
      # benchmark-smoke-tenferro-main.
      TENFERRO_UPDATE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          # The Pages generation step below reads per-commit history.
          fetch-depth: 0

      - name: Check devcontainer configuration and host virtualenv ownership
        run: |
          bash tests/test_devcontainer_config.sh
          docker pull alpine:3.21
          python3 tests/test_cuda_venv_ownership.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          # Track the latest stable Julia 1.x (matching the release channel used
          # for the recorded results and the committed Manifest.toml).
          version: "1"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev libomp-dev cmake build-essential

      - name: Prepare Python environment
        run: uv sync --frozen || uv sync

      - name: Setup external dependencies
        run: ./scripts/setup_extern_deps.sh

      - name: Test RunPod provisioning without paid resources
        run: |
          uv lock --check --project scripts/ci/runpod_runtime
          uv run python -m unittest discover -s scripts/ci/tests -p 'test_*.py'

      - name: Validate benchmark suite YAML files
        run: |
          uv run python scripts/validate_benchmark_suite.py \
            benchmarks/cpu/einsum.yaml \
            benchmarks/cpu/public_api.yaml \
            benchmarks/cpu/public_api_candidates.yaml \
            benchmarks/cpu/fft.yaml \
            benchmarks/cpu/permutation.yaml \
            benchmarks/cpu/cpu_ops.yaml \
            benchmarks/cpu/session_matrix.yaml \
            benchmarks/cpu/small_work.yaml \
            benchmarks/cpu/overhead_smoke.yaml \
            benchmarks/cpu/perf_issues.yaml \
            benchmarks/gpu/dense.yaml \
            benchmarks/gpu/dense_throughput.yaml \
            benchmarks/gpu/einsum.yaml \
            benchmarks/gpu/sparse.yaml \
            benchmarks/gpu/linalg_jvp_vjp.yaml \
            benchmarks/gpu/linalg_ad_latency.yaml \
            benchmarks/gpu/linalg_ad_throughput.yaml \
            benchmarks/gpu/elementwise.yaml \
            benchmarks/gpu/perf_issues.yaml \
            benchmarks/gpu/fft.yaml \
            benchmarks/gpu/nn.yaml \
            benchmarks/gpu/isolated_ops.yaml \
            benchmarks/gpu/structural.yaml \
            benchmarks/gpu/linalg_public_api_throughput.yaml \
            benchmarks/gpu/linalg_public_api_latency.yaml \
            benchmarks/gpu/lstsq.yaml \
            benchmarks/gpu/permutation.yaml \
            benchmarks/gpu/tensornetwork.yaml \
            benchmarks/gpu/reuse_contraction.yaml

      - name: Check Python scripts compile
        run: |
          uv run python -m py_compile \
            scripts/generate_dashboard.py \
            scripts/regime_policy.py \
            scripts/generate_history.py \
            scripts/report_summary.py \
            scripts/regenerate_report_summaries.py \
            scripts/render_run.py \
            scripts/finalize_run.py \
            scripts/validate_benchmark_suite.py \
            scripts/collect_run_metadata.py \
            scripts/benchmark_gpu_linalg_ad.py \
            scripts/format_gpu_linalg_ad_results.py \
            scripts/gpu_multi_output_verification.py \
            scripts/gpu_linalg_ad_contracts.py \
            scripts/verify_gpu_linalg_ad_rust.py \
            scripts/benchmark_gpu_public_api.py \
            scripts/benchmark_gpu_python.py \
            scripts/gpu_framework_runner.py \
            scripts/gpu_public_api_ops.py \
            scripts/gpu_case_traffic.py \
            scripts/gpu_copy_calibration.py \
            scripts/gpu_bandwidth_guard.py \
            scripts/format_gpu_public_api_results.py \
            scripts/public_api_candidates.py \
            scripts/format_results.py

      - name: Run layout validation test
        run: bash tests/test_suite_result_layout.sh

      - name: Check tenferro-rs checkout setup and pin
        run: bash tests/test_setup_extern_tenferro_checkout.sh

      - name: Check the pins against the stack
        run: uv run campaign-sync-pins . --repo tenferro-benchmark --check

      - name: Validate results dashboard
        run: uv run python -m unittest tests.test_generate_dashboard tests.test_generate_history tests.test_result_pipeline tests.test_cpu_thread_reports tests.test_publish_runs tests.test_publish_gpu_page tests.test_report_summary_reasons tests.test_regime_policy tests.test_source_contract tests.test_verification_mode_contract tests.test_cpu_suite_arms_doc

      - name: Validate the linalg AD verification modes
        run: uv run python -m unittest tests.test_linalg_ad_verify_modes

      - name: Check the generated README results table and the trend points
        run: |
          uv run python scripts/generate_readme_results.py --check
          uv run python -m unittest tests.test_readme_results tests.test_trend_points

      - name: Check published pages against the run records they name
        run: uv run python scripts/regenerate_report_summaries.py --check

      - name: Generate the Pages site and check it links only the latest generation
        run: |
          uv run python scripts/generate_dashboard.py --result-dir result --output-dir _site --git-repo .
          test -f _site/index.html && test -f _site/history.html
          if grep -rlE 'amd-cpu|linux-cpu|mac-cpu|mac-gpu' _site; then
            echo "ERROR: the generated site mentions an older hardware profile" >&2
            exit 1
          fi

      - name: Check zen5-cpu pinning and affinity metadata
        run: bash tests/test_cpu_pinning.sh

      - name: Check public API report output without runner stdout
        run: bash tests/test_public_api_table_output.sh

      - name: Validate public API candidate contracts
        run: |
          bash tests/test_public_api_selection.sh
          uv run python -m unittest tests.test_public_api_candidates

      - name: Validate public API fixture and report validity
        # The fixture tests guard the input each row's contract assumes (#299:
        # the lstsq row drives GELS, which needs full column rank).
        run: uv run python -m unittest tests.test_public_api_harness_validity

      - name: Validate GPU public API fixtures and timing contracts without a GPU
        run: |
          bash -n scripts/run_gpu_public_api.sh
          bash tests/test_gpu_artifact_cache.sh
          bash tests/test_gpu_linalg_ad_runner_contract.sh
          bash tests/test_gpu_throughput_runner_contract.sh
          uv run python -m unittest tests.test_gpu_public_api tests.test_gpu_bandwidth_guard tests.test_normalize_gpu_records tests.test_gpu_framework_runner tests.test_gpu_linalg_ad_contracts tests.test_gpu_multi_output_verification tests.test_gpu_routine_selection tests.test_gpu_routine_weekly_run tests.test_gpu_routine_coverage_report tests.test_gpu_routine_controls tests.test_gpu_routine_wall tests.test_gpu_paired tests.test_gpu_vendor_sampling tests.test_gpu_permutation_sampled_verify tests.test_gpu_sparse_cache tests.test_gpu_partial_publication tests.test_gpu_suite_continues_after_failure tests.test_gpu_permutation_continues_after_failure tests.test_gpu_suite_publish_step_failure

      - name: Validate host GPU preflight and recorded collection environment
        run: |
          bash -n scripts/tenferro_checkout.sh scripts/gpu_preflight.sh \
            scripts/run_gpu_linalg_jvp_vjp.sh scripts/run_gpu_public_api.sh \
            scripts/run_gpu_throughput.sh scripts/run_cpu_followup.sh
          bash tests/test_gpu_preflight.sh
          bash -n scripts/gpu_arm_launch.sh
          bash tests/test_gpu_arm_launch.sh
          bash tests/test_gpu_delegated_arm_continuation.sh
          uv run python -m unittest tests.test_gpu_measurement_cpu
          bash tests/test_tenferro_checkout_helpers.sh
          bash tests/test_cpu_followup_run_record.sh
          uv run python -m unittest tests.test_run_metadata_environment tests.test_run_metadata_host

      - name: Check generated profile and pinning tables
        run: uv run python scripts/sync_pinning_rows.py --check

      - name: Validate performance-issue case generation and reports
        run: |
          uv run python scripts/generate_perf_issue_cases.py --check
          uv run python scripts/generate_overhead_smoke_cases.py --check
          uv run python -m unittest tests.test_bot_perf_cases tests.test_perf_issues_suite tests.test_cpu_followup_cases tests.test_case_status tests.test_perf_issues_env tests.test_overhead_smoke tests.test_gpu_perf_issue_references

      - name: Cargo check
        run: cargo check --locked --all-targets --features strided-rs,hptt

      - name: Check CUDA runners without a GPU
        run: cargo check --locked --features cuda --all-targets

      - name: Check caller-owned CPU engine thread counts
        run: cargo test --locked --lib cpu_engine_tests

      - name: Check the verification-mode record writer
        # A filter that matches no test still prints `0 passed` and exits 0, so
        # the run alone would stay green if the tests disappeared. Require the
        # run to report at least one passing test.
        run: |
          cargo test --locked --lib verification_mode::tests 2>&1 | tee /tmp/vm.log
          grep -qE 'test result: ok\. [1-9][0-9]* passed' /tmp/vm.log

      - name: Check the Rust verification comparison boundary
        # The other runner's comparison (`compare_vectors`) is behind a bin, so
        # nothing above compiles it into a test. Same guard: one passing test
        # or the lane fails.
        run: |
          cargo test --locked --features cuda --bin benchmark_gpu_rust verification_tests 2>&1 | tee /tmp/gpu-rust-verify.log
          grep -qE 'test result: ok\. [1-9][0-9]* passed' /tmp/gpu-rust-verify.log

      - name: Check the public-API verification budget boundary
        # `scored` is the one allowance every public-API output is measured
        # against, and it lives behind the cuda-gated bin.  Filter to the
        # `budget` module: the same binary holds unrelated overhead-warning
        # tests, and unfiltered they satisfied this guard even with every
        # budget test ignored or deleted.
        run: |
          cargo test --locked --features cuda --bin benchmark_gpu_public_api tests::budget 2>&1 | tee /tmp/gpu-api-verify.log
          grep -qE 'test result: ok\. ([3-9]|[1-9][0-9]+) passed' /tmp/gpu-api-verify.log

      - name: Check the linalg AD JVP/VJP cases are registered on both arms
        run: cargo test --locked --bin publication_gate linalg_ad

      - name: Check overhead-smoke runtime timing scope
        run: cargo test --locked --bin perf_issue_case umbrella::alloc_counter::tests -- --test-threads=1

      - name: Check relative errors fail closed (NaN in a max fold, complex norm overflow)
        # Same guard as above: an emptied or renamed module still exits 0 with
        # `0 passed`, so require the expected number of passing tests.
        run: |
          cargo test --locked --bin perf_issue_case rel_error_tests 2>&1 | tee /tmp/rel-error.log
          grep -qE 'test result: ok\. ([3-9]|[1-9][0-9]+) passed' /tmp/rel-error.log
          cargo test --locked --features cuda --bin benchmark_gpu_perf_issues eigh_residual_tests 2>&1 | tee /tmp/eigh-residual.log
          grep -qE 'test result: ok\. ([2-9]|[1-9][0-9]+) passed' /tmp/eigh-residual.log

  followup-mwe:
    if: github.repository == 'tensor4all/tenferro-benchmark'
    runs-on: ubuntu-latest
    env:
      OPENBLAS_ROOT: /usr
      TENFERRO_UPDATE: "1"
      CARGO_TARGET_DIR: target/followup-ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install correctness-check provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev cmake build-essential
      - name: Setup the pinned tenferro-rs revision
        run: ./scripts/setup_extern_deps.sh
      - name: Build independent public-API MWE
        run: >-
          cargo build --release --locked --manifest-path mwe/cpu_followup/Cargo.toml
          --no-default-features --features system-openblas
      - name: Check prepared graph execution on a caller-owned engine
        run: >-
          cargo test --release --locked --manifest-path mwe/cpu_followup/Cargo.toml
          --no-default-features --features system-openblas
      - name: Check scalar and permutation oracles without timing collection
        run: |
          target/followup-ci/release/cpu-followup-mwe activation.gelu_tanh eager-shared 1 0
          target/followup-ci/release/cpu-followup-mwe metadata.transpose_view metadata 1 0
          target/followup-ci/release/cpu-followup-mwe perm.reverse_23d_2 materialize 1 0
          target/followup-ci/release/cpu-followup-mwe perm.reverse_23d_2 strided-rs 4 0
