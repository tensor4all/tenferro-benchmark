name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'tensor4all/tenferro-benchmark'
    runs-on: ubuntu-latest
    env:
      OPENBLAS_ROOT: /usr
      # setup_extern_deps.sh checks out the pinned revision
      # (pins/tenferro-rs.rev). Latest upstream main is exercised separately by
      # benchmark-smoke-tenferro-main.
      TENFERRO_UPDATE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          # The Pages generation step below reads per-commit history.
          fetch-depth: 0

      - name: Check devcontainer configuration and host virtualenv ownership
        run: |
          bash tests/test_devcontainer_config.sh
          docker pull alpine:3.21
          python3 tests/test_cuda_venv_ownership.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          # Track the latest stable Julia 1.x (matching the release channel used
          # for the recorded results and the committed Manifest.toml).
          version: "1"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev libomp-dev cmake build-essential

      - name: Prepare Python environment
        run: uv sync --frozen || uv sync

      - name: Setup external dependencies
        run: ./scripts/setup_extern_deps.sh

      - name: Test RunPod provisioning without paid resources
        run: |
          uv lock --check --project scripts/ci/runpod_runtime
          uv run python -m unittest discover -s scripts/ci/tests -p 'test_*.py'

      - name: Validate benchmark suite YAML files
        run: |
          uv run python scripts/validate_benchmark_suite.py \
            benchmarks/cpu/einsum.yaml \
            benchmarks/cpu/public_api.yaml \
            benchmarks/cpu/public_api_candidates.yaml \
            benchmarks/cpu/fft.yaml \
            benchmarks/cpu/permutation.yaml \
            benchmarks/cpu/cpu_ops.yaml \
            benchmarks/cpu/session_matrix.yaml \
            benchmarks/cpu/small_work.yaml \
            benchmarks/cpu/overhead_smoke.yaml \
            benchmarks/cpu/perf_issues.yaml \
            benchmarks/gpu/dense.yaml \
            benchmarks/gpu/einsum.yaml \
            benchmarks/gpu/sparse.yaml \
            benchmarks/gpu/linalg_jvp_vjp.yaml \
            benchmarks/gpu/linalg_ad_latency.yaml \
            benchmarks/gpu/elementwise.yaml \
            benchmarks/gpu/perf_issues.yaml \
            benchmarks/gpu/fft.yaml \
            benchmarks/gpu/nn.yaml \
            benchmarks/gpu/isolated_ops.yaml \
            benchmarks/gpu/structural.yaml \
            benchmarks/gpu/linalg_public_api.yaml \
            benchmarks/gpu/reuse_contraction.yaml

      - name: Check Python scripts compile
        run: |
          uv run python -m py_compile \
            scripts/generate_dashboard.py \
            scripts/generate_history.py \
            scripts/report_summary.py \
            scripts/regenerate_report_summaries.py \
            scripts/render_run.py \
            scripts/finalize_run.py \
            scripts/validate_benchmark_suite.py \
            scripts/collect_run_metadata.py \
            scripts/benchmark_gpu_linalg_ad.py \
            scripts/format_gpu_linalg_ad_results.py \
            scripts/gpu_multi_output_verification.py \
            scripts/gpu_linalg_ad_contracts.py \
            scripts/verify_gpu_linalg_ad_rust.py \
            scripts/benchmark_gpu_public_api.py \
            scripts/benchmark_gpu_python.py \
            scripts/gpu_framework_runner.py \
            scripts/gpu_public_api_ops.py \
            scripts/format_gpu_public_api_results.py \
            scripts/public_api_candidates.py \
            scripts/format_results.py

      - name: Run layout validation test
        run: bash tests/test_suite_result_layout.sh

      - name: Check tenferro-rs checkout setup and pin
        run: bash tests/test_setup_extern_tenferro_checkout.sh

      - name: Check the pins against the stack
        run: uv run campaign-sync-pins . --repo tenferro-benchmark --check

      - name: Validate results dashboard
        run: uv run python -m unittest tests.test_generate_dashboard tests.test_generate_history tests.test_result_pipeline tests.test_cpu_thread_reports tests.test_publish_runs

      - name: Check the generated README results table and the trend points
        run: |
          uv run python scripts/generate_readme_results.py --check
          uv run python -m unittest tests.test_readme_results tests.test_trend_points

      - name: Check published pages against the run records they name
        run: uv run python scripts/regenerate_report_summaries.py --check

      - name: Generate the Pages site and check it links only the latest generation
        run: |
          uv run python scripts/generate_dashboard.py --result-dir result --output-dir _site --git-repo .
          test -f _site/index.html && test -f _site/history.html
          if grep -rlE 'amd-cpu|linux-cpu|mac-cpu|mac-gpu' _site; then
            echo "ERROR: the generated site mentions an older hardware profile" >&2
            exit 1
          fi

      - name: Check zen5-cpu pinning and affinity metadata
        run: bash tests/test_cpu_pinning.sh

      - name: Check public API report output without runner stdout
        run: bash tests/test_public_api_table_output.sh

      - name: Validate public API candidate contracts
        run: |
          bash tests/test_public_api_selection.sh
          uv run python -m unittest tests.test_public_api_candidates

      - name: Validate GPU public API fixtures and timing contracts without a GPU
        run: |
          bash -n scripts/run_gpu_public_api.sh
          uv run python -m unittest tests.test_gpu_public_api tests.test_gpu_framework_runner tests.test_gpu_linalg_ad_contracts tests.test_gpu_multi_output_verification tests.test_gpu_routine_selection tests.test_gpu_routine_weekly_run tests.test_gpu_routine_coverage_report tests.test_gpu_routine_controls tests.test_gpu_routine_wall tests.test_gpu_paired tests.test_gpu_vendor_sampling tests.test_gpu_permutation_sampled_verify tests.test_gpu_sparse_cache

      - name: Check generated profile and pinning tables
        run: uv run python scripts/sync_pinning_rows.py --check

      - name: Validate performance-issue case generation and reports
        run: |
          uv run python scripts/generate_perf_issue_cases.py --check
          uv run python scripts/generate_overhead_smoke_cases.py --check
          uv run python -m unittest tests.test_perf_issues_suite tests.test_cpu_followup_cases tests.test_case_status tests.test_perf_issues_env tests.test_overhead_smoke tests.test_gpu_perf_issue_references

      - name: Cargo check
        run: cargo check --locked --all-targets --features strided-rs,hptt

      - name: Check CUDA runners without a GPU
        run: cargo check --locked --features cuda --all-targets

      - name: Check caller-owned CPU engine thread counts
        run: cargo test --locked --lib cpu_engine_tests

      - name: Check overhead-smoke runtime timing scope
        run: cargo test --locked --bin perf_issue_case umbrella::alloc_counter::tests -- --test-threads=1

  followup-mwe:
    if: github.repository == 'tensor4all/tenferro-benchmark'
    runs-on: ubuntu-latest
    env:
      OPENBLAS_ROOT: /usr
      TENFERRO_UPDATE: "1"
      CARGO_TARGET_DIR: target/followup-ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install correctness-check provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev cmake build-essential
      - name: Setup the pinned tenferro-rs revision
        run: ./scripts/setup_extern_deps.sh
      - name: Build independent public-API MWE
        run: >-
          cargo build --release --locked --manifest-path mwe/cpu_followup/Cargo.toml
          --no-default-features --features system-openblas
      - name: Check prepared graph execution on a caller-owned engine
        run: >-
          cargo test --release --locked --manifest-path mwe/cpu_followup/Cargo.toml
          --no-default-features --features system-openblas
      - name: Check scalar and permutation oracles without timing collection
        run: |
          target/followup-ci/release/cpu-followup-mwe activation.gelu_tanh eager-shared 1 0
          target/followup-ci/release/cpu-followup-mwe metadata.transpose_view metadata 1 0
          target/followup-ci/release/cpu-followup-mwe perm.reverse_23d_2 materialize 1 0
          target/followup-ci/release/cpu-followup-mwe perm.reverse_23d_2 strided-rs 4 0
