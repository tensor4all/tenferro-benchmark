name: verify-cpu-torch-342

# Temporary verification for #342: build the CPU devcontainer and assert that it
# carries no CUDA-only packages. Deleted before the change is merged.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'tensor4all/tenferro-benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Install devcontainer CLI
        run: npm install --global @devcontainers/cli

      - name: Create current MKL CPU devcontainer
        run: |
          set -o pipefail
          /usr/bin/time -v devcontainer up --workspace-folder . --remove-existing-container 2>&1 | tail -n 40

      - name: Assert the CPU environment carries no CUDA torch stack
        run: |
          devcontainer exec --workspace-folder . bash -lc '
            set -euo pipefail
            df -h / | tail -n 1
            du -sh .venv
            offenders=$(uv pip list --format=freeze | grep -icE "^(nvidia-|triton)" || true)
            echo "CUDA-only packages installed: $offenders"
            uv pip list --format=freeze | grep -iE "^(nvidia-|triton)" || true
            test "$offenders" -eq 0
            .venv/bin/python -c "import torch, sys; print(\"torch\", torch.__version__); assert torch.__version__.endswith(\"+cpu\"), torch.__version__"
            df -h / | tail -n 1
          '
