name: benchmark-smoke-tenferro-main

on:
  schedule:
    # 01:17 JST (16:17 UTC) every day; earlier than the full nightly suites.
    - cron: "17 16 * * *"
  workflow_dispatch:

# Smoke-test the benchmark harness against the latest tenferro-rs main.
# This answers "can we clone tenferro-rs main and run a tiny benchmark?"
# It is not a regression detector; use the full nightly suites for that.
permissions:
  contents: read

concurrency:
  group: benchmark-smoke-tenferro-main
  cancel-in-progress: false

env:
  # Pin the interpreter: hosted images move to Python releases that the locked
  # torch wheels do not support yet (macos-26 Homebrew python3.15, 2026-10).
  UV_PYTHON: "3.14"

jobs:
  mac-cpu-smoke:
    if: github.repository == 'tensor4all/tenferro-benchmark'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout benchmark harness
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Prepare environment and check out latest tenferro-rs main
        env:
          TENFERRO_REF: main
          TENFERRO_UPDATE: "1"
        run: |
          uv sync --frozen || uv sync
          ./scripts/setup_extern_deps.sh
          echo "tenferro-rs commit: $(git -C extern/tenferro-rs rev-parse HEAD)"

      - name: Run minimal einsum smoke test
        env:
          BENCHMARK_TARGET_PROFILE: mac-cpu
          BENCHMARK_ALLOW_BUSY_HOST: "1"
          BENCH_INSTANCE: bin_matmul_256
          BENCH_WARMUPS: "1"
          BENCH_RUNS: "1"
        run: ./scripts/run_all_rust.sh 1

  linux-cpu-smoke:
    if: github.repository == 'tensor4all/tenferro-benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout benchmark harness
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install devcontainer CLI
        run: npm install --global @devcontainers/cli

      - name: Create current MKL CPU devcontainer
        run: devcontainer up --workspace-folder . --remove-existing-container

      - name: Check out latest tenferro-rs and run minimal einsum smoke test
        run: |
          devcontainer exec --workspace-folder . bash -lc '
            set -euo pipefail
            test -d "$MKLROOT/include"
            export TENFERRO_CPU_FEATURES=blas-mkl
            export BENCHMARK_TARGET_PROFILE=amd-cpu
            export TENFERRO_REF=main TENFERRO_UPDATE=1
            ./scripts/setup_extern_deps.sh
            echo "tenferro-rs commit: $(git -C extern/tenferro-rs rev-parse HEAD)"
            export BENCH_INSTANCE=bin_matmul_256 BENCH_WARMUPS=1 BENCH_RUNS=1
            ./scripts/run_all_rust.sh 1'
