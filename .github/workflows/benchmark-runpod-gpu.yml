name: benchmark-runpod-gpu
'on':
  workflow_dispatch:
    inputs:
      arm:
        type: choice
        options:
        - baseline
        - candidate
        default: candidate
        required: true
        description: Frozen full-CI cost experiment arm
      prepare_only:
        type: boolean
        default: false
        description: Prepare immutable artifacts without allocating a GPU
      prepared_run_id:
        type: number
        default: 0
        description: Reuse frozen prepared artifacts from a diagnostic run; zero prepares anew
      candidate_gpu:
        type: choice
        options:
        - NVIDIA A40
        - NVIDIA RTX 6000 Ada Generation
        - NVIDIA RTX 2000 Ada Generation
        - NVIDIA RTX A4000
        - NVIDIA RTX A5000
        - NVIDIA RTX A6000
        - NVIDIA GeForce RTX 4090
        default: NVIDIA A40
        description: Exact GPU for diagnostic candidate; no fallback
permissions:
  contents: read
concurrency:
  group: benchmark-runpod-gpu
  cancel-in-progress: false
env:
  ORG_NAME: tensor4all
  TENFERRO_REPO: tensor4all/tenferro-rs
  CARGO_TERM_COLOR: always
  CUBECL_DEBUG_LOG: '0'
  CUDA_ARCHIVE: cuda-tests.tar.zst
  PJRT_ARCHIVE: pjrt-tests.tar.zst
  CUDA_TUTORIAL_ARCHIVE: cuda-tutorial.tar.zst
  CUDARC_CUDA_VERSION: '12080'
  CUDA_MIN_RUNTIME_VERSION: '12.6'
  CUDA_RUNTIME_VERSION: '12.8'
  ARCHIVE_WORKSPACE_ROOT: /home/runner/work/tenferro-rs/tenferro-rs
  TENFERRO_CI_CACHE_ROOT: /opt/tenferro-ci
  CUTENSOR_VERSION: 2.6.0.4
  JAX_CUDA12_PJRT_VERSION: 0.10.2
  NVIDIA_CUDNN_CU12_VERSION: 9.23.2.1
  NVIDIA_CUDA_NVCC_CU12_VERSION: 12.9.86
  RUNPOD_IMAGE: ${{ inputs.arm == 'candidate' && 'nvidia/cuda:12.8.1-runtime-ubuntu24.04@sha256:ebef3c171eeef0298e4eb2e4be843105edf3b8b0ac45e0b43acee358e8046867'
    || 'nvidia/cuda:12.6.3-runtime-ubuntu24.04@sha256:92906d87596d638d35015c6353053121bd299d25943b875763321653884ba924' }}
  TENFERRO_REF: 2605c46f45016a2472ebdf7ba75bba533bc6a5fd
jobs:
  prepare-transfer:
    name: Prepare frozen CI test artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Checkout pinned tenferro sources
      uses: actions/checkout@v4
      with:
        repository: tensor4all/tenferro-rs
        ref: ${{ env.TENFERRO_REF }}
        path: tenferro-rs
        persist-credentials: false
    - name: Download frozen same-source archives and runtime
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        repository: tensor4all/tenferro-benchmark
        run-id: 37814278025
        pattern: ci-cost-37814278025-part*
        merge-multiple: true
        path: frozen-transfer
        github-token: ${{ github.token }}
    - name: Verify and prune transferred common payload
      run: |
        set -euo pipefail
        for part in 00 01 02 03 04; do test -s "frozen-transfer/archives.part${part}"; done
        cat frozen-transfer/archives.part00 frozen-transfer/archives.part01 frozen-transfer/archives.part02 frozen-transfer/archives.part03 frozen-transfer/archives.part04 | tar -xf - -C tenferro-rs
        (cd tenferro-rs; sha256sum --check ../frozen-transfer/archives.sha256)
        before=$(wc -c < tenferro-rs/gpu-ci-runtime.tar.zst)
          mkdir common
          tar --zstd -xf tenferro-rs/gpu-ci-runtime.tar.zst -C common
          lib=common/opt/tenferro-ci/cutensor-2.6.0.4/lib
          sha256sum "$lib/libcutensor.so.2" > /tmp/cutensor-before.sha256
          rm -f "$lib"/*.a "$lib"/libcutensorMg.so* "$lib"/libcutensorMp.so*
          sha256sum --check /tmp/cutensor-before.sha256
          tar --zstd -cf tenferro-rs/gpu-ci-runtime.tar.zst -C common .
        after=$(wc -c < tenferro-rs/gpu-ci-runtime.tar.zst)
        echo "Common compressed bytes: $before -> $after"
    - name: Download same-source complete CUDA SDK
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        repository: tensor4all/tenferro-benchmark
        run-id: 37814278025
        pattern: ci-sdk-37814278025-cuda12.8-part*
        merge-multiple: true
        path: sdk-transfer
        github-token: ${{ github.token }}
    - name: Prepare identical or preloaded SDK transfer
      env:
        EXPERIMENT_ARM: ${{ inputs.arm }}
      run: |
        set -euo pipefail
        for part in 00 01 02 03 04; do test -s "sdk-transfer/sdk.part${part}"; done
        cat sdk-transfer/sdk.part00 sdk-transfer/sdk.part01 sdk-transfer/sdk.part02 sdk-transfer/sdk.part03 sdk-transfer/sdk.part04 > sdk-transfer/sdk.tar.zst
        (cd sdk-transfer; sha256sum --check sdk.sha256)
        mkdir sdk-tree
        if [ "$EXPERIMENT_ARM" = candidate ]; then
          tar --zstd -xf sdk-transfer/sdk.tar.zst -C sdk-tree
          python3 scripts/ci/reuse_preloaded_sdk.py --sdk sdk-tree --prepare
          tar --zstd -cf sdk-transfer/sdk.tar.zst -C sdk-tree .
        fi
        (cd sdk-transfer; sha256sum sdk.tar.zst > sdk.sha256; rm sdk.part*; split -n 5 -d -a 2 sdk.tar.zst sdk.part)
        for part in 00 01 02 03 04; do
          mkdir -p "runtime-sdk-12.8/$part"
          mv "sdk-transfer/sdk.part$part" "runtime-sdk-12.8/$part/"
        done
        mv sdk-transfer/sdk.sha256 runtime-sdk-12.8/00/
    - name: Prepare five archive transfer parts
      timeout-minutes: 2
      run: |
        set -euo pipefail
        mkdir archive-transfer
        cd tenferro-rs
        sha256sum "${CUDA_ARCHIVE}" "${PJRT_ARCHIVE}" "${CUDA_TUTORIAL_ARCHIVE}" gpu-ci-runtime.tar.zst > ../archive-transfer/archives.sha256
        tar -cf ../archive-transfer/archives.tar "${CUDA_ARCHIVE}" "${PJRT_ARCHIVE}" "${CUDA_TUTORIAL_ARCHIVE}" gpu-ci-runtime.tar.zst
        cd ../archive-transfer
        split -n 5 -d -a 2 archives.tar archives.part
        rm archives.tar
        for part in 00 01 02 03 04; do
          mkdir "${part}"
          mv "archives.part${part}" "${part}/"
        done
        mv archives.sha256 00/
    - name: Upload archive transfer part 00
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ci-cost-${{ github.run_id }}-part00
        path: archive-transfer/00/
        compression-level: 0
        if-no-files-found: error
        retention-days: 7
    - name: Upload archive transfer part 01
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ci-cost-${{ github.run_id }}-part01
        path: archive-transfer/01/
        compression-level: 0
        if-no-files-found: error
        retention-days: 7
    - name: Upload archive transfer part 02
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ci-cost-${{ github.run_id }}-part02
        path: archive-transfer/02/
        compression-level: 0
        if-no-files-found: error
        retention-days: 7
    - name: Upload archive transfer part 03
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ci-cost-${{ github.run_id }}-part03
        path: archive-transfer/03/
        compression-level: 0
        if-no-files-found: error
        retention-days: 7
    - name: Upload archive transfer part 04
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ci-cost-${{ github.run_id }}-part04
        path: archive-transfer/04/
        compression-level: 0
        if-no-files-found: error
        retention-days: 7
    - name: Upload measured CUDA SDK part 00
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ci-sdk-${{ github.run_id }}-cuda12.8-part00
        path: runtime-sdk-12.8/00/
        retention-days: 7
    - name: Upload measured CUDA SDK part 01
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ci-sdk-${{ github.run_id }}-cuda12.8-part01
        path: runtime-sdk-12.8/01/
        retention-days: 7
    - name: Upload measured CUDA SDK part 02
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ci-sdk-${{ github.run_id }}-cuda12.8-part02
        path: runtime-sdk-12.8/02/
        retention-days: 7
    - name: Upload measured CUDA SDK part 03
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ci-sdk-${{ github.run_id }}-cuda12.8-part03
        path: runtime-sdk-12.8/03/
        retention-days: 7
    - name: Upload measured CUDA SDK part 04
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ci-sdk-${{ github.run_id }}-cuda12.8-part04
        path: runtime-sdk-12.8/04/
        retention-days: 7
    if: ${{ inputs.prepared_run_id == 0 }}
  start-runpod:
    name: Start ephemeral RunPod runner
    needs:
    - prepare-transfer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pod_id: ${{ steps.create_pod.outputs.pod_id }}
      runner_label: ${{ steps.create_pod.outputs.runner_label }}
      gpu_cost_per_hr: ${{ steps.create_pod.outputs.gpu_cost_per_hr }}
    steps:
    - name: Checkout trusted benchmark harness
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Create GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.GH_APP_ID }}
        private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        permission-organization-self-hosted-runners: write
    - name: Validate RunPod configuration
      env:
        RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      run: python3 -m scripts.ci.runpod_contract --config scripts/ci/runpod_config.json
    - name: Bound this experiment to one inexpensive candidate
      run: |
        python3 - <<'CONFIG'
        import json, os
        from pathlib import Path
        from scripts.ci.runpod_pricing import fetch_gpu_offers, http_transport, GRAPHQL_URL
        path=Path('scripts/ci/runpod_config.json')
        config=json.loads(path.read_text())
        arm=os.environ['EXPERIMENT_ARM']
        gpu=os.environ['CANDIDATE_GPU']
        ceiling={'NVIDIA RTX 6000 Ada Generation':1.10,'NVIDIA RTX 2000 Ada Generation':0.35,'NVIDIA A40':0.60,'NVIDIA RTX A4000':0.35,'NVIDIA RTX A5000':0.35,'NVIDIA RTX A6000':0.65,'NVIDIA GeForce RTX 4090':0.85}[gpu]
        offers=fetch_gpu_offers([gpu], min_vram_gb=8, transport=http_transport(GRAPHQL_URL))
        if not offers or offers[0].price_per_hr > ceiling:
            raise SystemExit(f'{gpu} unavailable below ${ceiling}/hr; no pod created')
        config['gpu_tiers']=[{'name':'experiment','gpu_type_ids':[gpu]}]
        config['allowed_cuda_versions']=['13.0','12.9','12.8']
        config['max_price_candidates']=1
        config['max_provision_attempts']=1
        config['same_tier_retries']=0
        path.write_text(json.dumps(config))
        print(f'{arm}: {gpu}, ${offers[0].price_per_hr}/hr')
        CONFIG
      env:
        EXPERIMENT_ARM: ${{ inputs.arm }}
        CANDIDATE_GPU: ${{ inputs.candidate_gpu }}
    - name: Provision compatible RunPod GPU
      id: create_pod
      env:
        RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        PROVISION_GH_TOKEN: ${{ steps.app-token.outputs.token }}
        PROVISION_ORG: ${{ github.repository_owner }}
        PROVISION_RUNNER_GROUP_ID: ${{ vars.RUNPOD_RUNNER_GROUP_ID || '4' }}
        PROVISION_RUNNER_LABEL: runpod-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
        PYTHONUNBUFFERED: '1'
        EXPERIMENT_ARM: ${{ inputs.arm }}
      run: |
        set -euo pipefail
        cat > /tmp/runpod-startup.sh <<'STARTUP'
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        export RUNNER_ALLOW_RUNASROOT=1
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl tar gzip zstd python3 python3-pip git
        nvidia-smi
        cat > /tmp/cuda_smoke_test.py <<'SMOKE'
        STARTUP
        cat scripts/ci/cuda_smoke_test.py >> /tmp/runpod-startup.sh
        cat >> /tmp/runpod-startup.sh <<'STARTUP'
        SMOKE
        env -u RUNNER_JIT_CONFIG python3 /tmp/cuda_smoke_test.py \
          --min-runtime-version 12.6 --full-runtime-version 12.8 --min-vram-gb 8
        cd /tmp
        version=2.337.0
        sha256=70920811a4f8ad4328818682bca5c6469c1c942fab52448868071d0063816613
        tarball="actions-runner-linux-x64-${version}.tar.gz"
        curl -fsSL -o "${tarball}" "https://github.com/actions/runner/releases/download/v${version}/${tarball}"
        echo "${sha256}  ${tarball}" | sha256sum -c -
        mkdir -p actions-runner
        cd actions-runner
        tar xzf "../${tarball}"
        ./bin/installdependencies.sh
        ./run.sh --jitconfig "${RUNNER_JIT_CONFIG}"
        STARTUP
        if [ "$EXPERIMENT_ARM" = candidate ]; then
          sed -i 's/--min-runtime-version 12.6/--skip-nvrtc-install --min-runtime-version 12.8/' /tmp/runpod-startup.sh
        fi
        # Capacity retry boundary: retry only a zero-pod stock race.
        base_runner_label="$PROVISION_RUNNER_LABEL"
        for create_attempt in 1 2 3; do
          export PROVISION_RUNNER_LABEL="${base_runner_label}-create${create_attempt}"
          create_log="/tmp/runpod-create-${create_attempt}.log"
          if python3 -m scripts.ci.runpod_provision \
            --config scripts/ci/runpod_config.json \
            --startup-script /tmp/runpod-startup.sh \
            --image-name "$RUNPOD_IMAGE" \
            --response-file /tmp/runpod-response.json 2>&1 | tee "$create_log"; then
            break
          fi
          if grep -q '^Created pod ' "$create_log" ||
             ! grep -q 'RunPod HTTP 500.*There are no instances currently available' "$create_log" ||
             [ "$create_attempt" -eq 3 ]; then
            exit 1
          fi
          echo "Zero-pod capacity race; retrying the same GPU after 15 hosted seconds."
          sleep 15
        done
    - name: Delete pod after startup failure
      if: ${{ (failure() || cancelled()) && steps.create_pod.outputs.pod_id != '' }}
      env:
        RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        POD_ID: ${{ steps.create_pod.outputs.pod_id }}
      run: |
        set -euo pipefail
        status="$(curl -sS -o /tmp/delete-startup.json -w '%{http_code}' \
          -X DELETE "https://rest.runpod.io/v1/pods/${POD_ID}" \
          -H "Authorization: Bearer ${RUNPOD_API_KEY}")"
        [[ "$status" == 404 || ("$status" -ge 200 && "$status" -lt 300) ]]
    if: ${{ !cancelled() && !inputs.prepare_only && (needs.prepare-transfer.result == 'success' || needs.prepare-transfer.result
      == 'skipped') }}
  run-ci:
    name: CUDA GPU tests on RunPod
    needs:
    - prepare-transfer
    - start-runpod
    runs-on:
    - self-hosted
    - ${{ needs.start-runpod.outputs.runner_label }}
    timeout-minutes: 25
    steps:
    - name: Checkout pinned tenferro sources
      timeout-minutes: 2
      uses: actions/checkout@v4
      with:
        repository: tensor4all/tenferro-rs
        ref: ${{ env.TENFERRO_REF }}
        path: tenferro-rs
        persist-credentials: false
    - name: Checkout frozen image transfer helper
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: followup-controller
        persist-credentials: false
    - name: Select CUDA runtime for driver
      id: select_cuda_runtime
      timeout-minutes: 1
      run: |
        set -euo pipefail
        driver_version="$(nvidia-smi | sed -n 's/.*CUDA Version: \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | head -1)"
        if [ -z "${driver_version}" ]; then
          echo "Could not determine the CUDA driver API version from nvidia-smi." >&2
          exit 1
        fi

        cuda_version_ge() {
          local version="$1"
          local min_version="$2"
          local ver_major="${version%%.*}"
          local ver_minor="${version#*.}"
          local min_major="${min_version%%.*}"
          local min_minor="${min_version#*.}"
          if [ "${ver_major}" -gt "${min_major}" ]; then
            return 0
          fi
          if [ "${ver_major}" -lt "${min_major}" ]; then
            return 1
          fi
          [ "${ver_minor}" -ge "${min_minor}" ]
        }

        if ! cuda_version_ge "${driver_version}" "${CUDA_MIN_RUNTIME_VERSION}"; then
          echo "CUDA driver API ${driver_version} is below the ${CUDA_MIN_RUNTIME_VERSION} minimum." >&2
          exit 1
        fi
        if cuda_version_ge "${driver_version}" "${CUDA_RUNTIME_VERSION}"; then
          runtime_version="${CUDA_RUNTIME_VERSION}"
          capability_tier="full"
        else
          runtime_version="${CUDA_MIN_RUNTIME_VERSION}"
          capability_tier="baseline"
        fi

        {
          echo "driver_version=${driver_version}"
          echo "runtime_version=${runtime_version}"
          echo "capability_tier=${capability_tier}"
        } >> "${GITHUB_OUTPUT}"
        echo "Driver CUDA API: ${driver_version}"
        echo "Selected CUDA runtime: ${runtime_version} (${capability_tier} CubeCL capabilities)"
    - name: Start archive transfer timing
      timeout-minutes: 1
      run: |
        mkdir archive-transfer
        date +%s > archive-transfer-start
    - name: Transfer identical archives
      timeout-minutes: 4
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: ci-cost-${{ inputs.prepared_run_id || github.run_id }}-part*
        merge-multiple: true
        path: archive-transfer
        run-id: ${{ inputs.prepared_run_id || github.run_id }}
        github-token: ${{ github.token }}
    - name: Reconstruct and verify archive transfer
      timeout-minutes: 1
      run: |
        set -euo pipefail
        cd archive-transfer
        # Require all five parts even when a download action matched none.
        for part in 00 01 02 03 04; do
          test -s "archives.part${part}"
        done
        cat archives.part00 archives.part01 archives.part02 archives.part03 archives.part04 | tar -xf - -C ../tenferro-rs
        cd ../tenferro-rs
        sha256sum --check ../archive-transfer/archives.sha256
        elapsed=$(( $(date +%s) - $(cat ../archive-transfer-start) ))
        echo "Archive transfer, reconstruction and verification: ${elapsed}s"
        echo "Archive transfer, reconstruction and verification: ${elapsed}s" >> "${GITHUB_STEP_SUMMARY}"
        rm -rf ../archive-transfer ../archive-transfer-start
    - name: Install staged execution payload
      timeout-minutes: 2
      run: |
        set -euo pipefail
        mkdir -p /opt/ci-cost-runtime /opt/tenferro-ci
        tar --zstd -xf tenferro-rs/gpu-ci-runtime.tar.zst -C /opt/ci-cost-runtime
        cp -a /opt/ci-cost-runtime/opt/tenferro-ci/. /opt/tenferro-ci/
        echo /opt/ci-cost-runtime/bin >> "$GITHUB_PATH"
        apt-get update
        apt-get install -y --no-install-recommends binutils
    - name: Transfer selected CUDA SDK
      timeout-minutes: 4
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: ci-sdk-${{ inputs.prepared_run_id || github.run_id }}-cuda12.8-part*
        merge-multiple: true
        path: sdk-transfer
        run-id: ${{ inputs.prepared_run_id || github.run_id }}
        github-token: ${{ github.token }}
    - name: Install selected CUDA SDK
      timeout-minutes: 2
      env:
        SELECTED_RUNTIME: ${{ steps.select_cuda_runtime.outputs.runtime_version }}
        EXPERIMENT_ARM: ${{ inputs.arm }}
      run: |
        set -euo pipefail
        cd sdk-transfer
        for part in 00 01 02 03 04; do test -s "sdk.part${part}"; done
        cat sdk.part00 sdk.part01 sdk.part02 sdk.part03 sdk.part04 > sdk.tar.zst
        sha256sum --check sdk.sha256
        sdk_root="/opt/ci-cost-runtime/cuda-${SELECTED_RUNTIME}"
        mkdir -p "$sdk_root"
        tar --zstd -xf sdk.tar.zst -C "$sdk_root"
        if [ "$EXPERIMENT_ARM" = candidate ]; then
          python3 ../followup-controller/scripts/ci/reuse_preloaded_sdk.py --sdk "$sdk_root"
        fi
        test -f "$sdk_root/.seed-complete"
        for lib in nvrtc cublas cusolver cusparse; do
          directory="$sdk_root/targets/x86_64-linux/lib"
          if [ ! -e "$directory/lib${lib}.so" ]; then
            soname=$(find "$directory" -maxdepth 1 -name "lib${lib}.so.*" -print -quit)
            test -n "$soname"
            ln -s "$(basename "$soname")" "$directory/lib${lib}.so"
          fi
        done
    - name: Record host and cold-cache state
      timeout-minutes: 1
      run: |
        set -euo pipefail
        nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv
        lscpu
        cat /proc/self/status | grep Cpus_allowed_list
        cat /sys/fs/cgroup/cpu.max || true
        ls -d /usr/local/cuda* || true
        rm -rf /root/.nv/ComputeCache /root/.cache/cubecl
    - name: Configure CUDA runtime libraries
      timeout-minutes: 1
      env:
        CUDA_DRIVER_VERSION: ${{ steps.select_cuda_runtime.outputs.driver_version }}
        CUDA_RUNTIME_VERSION: ${{ steps.select_cuda_runtime.outputs.runtime_version }}
      run: |
        set -euo pipefail
        cuda_path="/opt/ci-cost-runtime/cuda-${CUDA_RUNTIME_VERSION}"
        test -f "${cuda_path}/.seed-complete"
        for lib in nvrtc cublas cusolver cusparse; do test -e "${cuda_path}/lib64/lib${lib}.so"; done
        cutensor_path="${TENFERRO_CI_CACHE_ROOT}/cutensor-${CUTENSOR_VERSION}/lib/libcutensor.so.2"
        test -e "$cutensor_path"
        {
          echo "CUDA_PATH=${cuda_path}"
          echo "LD_LIBRARY_PATH=${cuda_path}/lib64:$(dirname "$cutensor_path"):${LD_LIBRARY_PATH:-}"
          echo "TENFERRO_CUTENSOR_PATH=${cutensor_path}"
        } >> "$GITHUB_ENV"
    - name: Verify loaded NVRTC version
      timeout-minutes: 1
      env:
        CUDA_DRIVER_VERSION: ${{ steps.select_cuda_runtime.outputs.driver_version }}
        CUDA_RUNTIME_VERSION: ${{ steps.select_cuda_runtime.outputs.runtime_version }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import ctypes
        import os

        nvrtc = ctypes.CDLL("libnvrtc.so")
        major = ctypes.c_int()
        minor = ctypes.c_int()
        status = nvrtc.nvrtcVersion(ctypes.byref(major), ctypes.byref(minor))
        if status != 0:
            raise SystemExit(f"nvrtcVersion failed with status {status}")
        loaded = (major.value, minor.value)
        driver = tuple(
            int(part) for part in os.environ["CUDA_DRIVER_VERSION"].split(".")
        )
        selected = tuple(
            int(part) for part in os.environ["CUDA_RUNTIME_VERSION"].split(".")
        )
        minimum = tuple(
            int(part)
            for part in os.environ["CUDA_MIN_RUNTIME_VERSION"].split(".")
        )
        full = (12, 8)
        print(f"Driver CUDA API version: {driver[0]}.{driver[1]}")
        print(f"Loaded NVRTC version: {loaded[0]}.{loaded[1]}")
        if driver < minimum:
            raise SystemExit(
                f"CUDA driver API {driver[0]}.{driver[1]} is older than minimum "
                f"CUDA {minimum[0]}.{minimum[1]}"
            )
        if loaded < minimum:
            raise SystemExit(
                f"NVRTC {loaded[0]}.{loaded[1]} is older than minimum "
                f"CUDA {minimum[0]}.{minimum[1]}"
            )
        if loaded > driver:
            raise SystemExit(
                f"NVRTC {loaded[0]}.{loaded[1]} is newer than driver API "
                f"{driver[0]}.{driver[1]}"
            )
        if loaded != selected:
            raise SystemExit(
                f"Loaded NVRTC {loaded[0]}.{loaded[1]} does not match selected "
                f"CUDA runtime {selected[0]}.{selected[1]}"
            )
        tier = "full" if loaded >= full and driver >= full else "baseline"
        print(f"Expected CubeCL CUDA capability tier: {tier}")
        PY
    - name: Link archive build workspace path
      timeout-minutes: 1
      run: |
        set -euo pipefail
        archive_root="${ARCHIVE_WORKSPACE_ROOT}"
        mkdir -p "$(dirname "${archive_root}")"
        if [ -e "${archive_root}" ] && [ ! -L "${archive_root}" ]; then
          echo "Archive workspace path exists and is not a symlink: ${archive_root}" >&2
          exit 1
        fi
        ln -sfn "${GITHUB_WORKSPACE}" "${archive_root}"
        echo "Linked ${archive_root} -> ${GITHUB_WORKSPACE}"
        test -f "${archive_root}/tenferro-rs/crates/tenferro-ad/src/context.rs"
    - name: Run CUDA tests from archive
      working-directory: tenferro-rs
      env:
        NEXTEST_TEST_THREADS: '1'
      run: |
        set -euo pipefail
        python3 scripts/ci/gpu_test_partition.py --kind cuda --lane gpu \
          --archive-file "${CUDA_ARCHIVE}" \
          --workspace-remap "${GITHUB_WORKSPACE}/tenferro-rs"
    - name: Run CUDA tutorial artifact
      working-directory: tenferro-rs
      run: |
        set -euo pipefail
        tutorial_dir="${RUNNER_TEMP}/cuda-tutorial"
        rm -rf "${tutorial_dir}"
        mkdir -p "${tutorial_dir}"
        tar --zstd -xf "${CUDA_TUTORIAL_ARCHIVE}" -C "${tutorial_dir}"
        TENFERRO_REQUIRE_CUDA=1 "${tutorial_dir}/cuda_tutorial"
    - name: Run OpenXLA PJRT E2E tests from archive
      working-directory: tenferro-rs
      env:
        NEXTEST_TEST_THREADS: '1'
      run: |
        set -euo pipefail
        if [ ! -f "${PJRT_ARCHIVE}" ]; then
          echo "Missing PJRT archive: ${PJRT_ARCHIVE}"
          exit 1
        fi
        wheel_dir="${RUNNER_TEMP}/openxla-pjrt-wheels"
        unpack_dir="${RUNNER_TEMP}/openxla-pjrt"
        rm -rf "${wheel_dir}" "${unpack_dir}"
        mkdir -p "${wheel_dir}" "${unpack_dir}"
        cp /opt/ci-cost-runtime/wheels/*.whl "${wheel_dir}/"
        python3 - <<'PY'
        import os
        import pathlib
        import zipfile

        wheel_dir = pathlib.Path(os.environ["RUNNER_TEMP"]) / "openxla-pjrt-wheels"
        unpack_dir = pathlib.Path(os.environ["RUNNER_TEMP"]) / "openxla-pjrt"
        for wheel in wheel_dir.glob("*.whl"):
            target = unpack_dir / wheel.stem
            with zipfile.ZipFile(wheel) as archive:
                archive.extractall(target)
        PY
        plugin_path="$(find "${unpack_dir}" -path '*/jax_plugins/xla_cuda12/xla_cuda_plugin.so' -print -quit)"
        cudnn_lib="$(find "${unpack_dir}" -path '*/nvidia/cudnn/lib' -type d -print -quit)"
        cuda_nvcc_dir="$(find "${unpack_dir}" -path '*/nvidia/cuda_nvcc' -type d -print -quit)"
        if [ -z "${plugin_path}" ]; then
          echo "xla_cuda_plugin.so not found under ${unpack_dir}"
          exit 1
        fi
        if [ -z "${cudnn_lib}" ]; then
          echo "cuDNN lib directory not found under ${unpack_dir}"
          exit 1
        fi
        if [ -z "${cuda_nvcc_dir}" ]; then
          echo "CUDA NVCC directory not found under ${unpack_dir}"
          exit 1
        fi
        chmod +x "${cuda_nvcc_dir}/bin/"*
        test -x "${cuda_nvcc_dir}/bin/ptxas"
        test -f "${cuda_nvcc_dir}/nvvm/libdevice/libdevice.10.bc"
        nm -D "${plugin_path}" | grep -q GetPjrtApi
        # Runtime-only plugin setup; Rust binaries come from the hosted PJRT archive.
        XLA_FLAGS="--xla_gpu_cuda_data_dir=${cuda_nvcc_dir} ${XLA_FLAGS:-}" \
        TENFERRO_PJRT_PLUGIN="${plugin_path}" \
        LD_LIBRARY_PATH="${cudnn_lib}:${LD_LIBRARY_PATH:-}" \
          python3 scripts/ci/gpu_test_partition.py --kind pjrt --lane gpu \
            --archive-file "${PJRT_ARCHIVE}" \
            --workspace-remap "${GITHUB_WORKSPACE}/tenferro-rs"
    - name: GPU test complete
      run: echo "RUNPOD_TENFERRO_GPU_TEST_OK"
    if: ${{ !cancelled() && needs.start-runpod.result == 'success' }}
    permissions:
      contents: read
      actions: read
  cleanup-runpod:
    name: Delete RunPod pod
    if: always()
    needs:
    - start-runpod
    - run-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Record pod paid time before deletion
      if: needs.start-runpod.outputs.pod_id != ''
      continue-on-error: true
      timeout-minutes: 1
      env:
        RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        POD_ID: ${{ needs.start-runpod.outputs.pod_id }}
      run: |
        set -euo pipefail
        curl -fsS "https://rest.runpod.io/v1/pods/${POD_ID}" -H "Authorization: Bearer ${RUNPOD_API_KEY}" > /tmp/pod.json
        python3 - <<'COST'
        import json, datetime
        p=json.load(open('/tmp/pod.json'))
        print(json.dumps({k:p.get(k) for k in ['id','lastStartedAt','costPerHr','adjustedCostPerHr','gpu']}))
        print('observed_at',datetime.datetime.now(datetime.timezone.utc).isoformat())
        COST
    - name: Delete RunPod pod
      if: needs.start-runpod.outputs.pod_id != ''
      env:
        RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        POD_ID: ${{ needs.start-runpod.outputs.pod_id }}
      run: |
        set -euo pipefail
        status="$(curl -sS -o /tmp/delete.json -w '%{http_code}' \
          -X DELETE "https://rest.runpod.io/v1/pods/${POD_ID}" \
          -H "Authorization: Bearer ${RUNPOD_API_KEY}")"
        cat /tmp/delete.json || true
        [[ "$status" == 404 || ("$status" -ge 200 && "$status" -lt 300) ]]

        echo "CI_COST_DELETE_CONFIRMED"
  setup-watchdog:
    name: Bound paid GPU setup
    needs:
    - start-runpod
    if: ${{ !cancelled() && needs.start-runpod.result == 'success' && needs.start-runpod.outputs.pod_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Watch accepted setup deadline
      env:
        POD_ID: ${{ needs.start-runpod.outputs.pod_id }}
        RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        GH_TOKEN: ${{ github.token }}
        BUDGET: '900'
      run: python3 -m scripts.ci.runpod_setup_watchdog --budget-seconds "$BUDGET"
