name: benchmark-runpod-gpu

# Experiment-only branch for tensor4all/tenferro-rs#2002. The production
# benchmark suites are not modified on main. No test binaries are executed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-runpod-gpu
  cancel-in-progress: false

env:
  RUNPOD_IMAGE: runpod/pytorch:1.1.0-cu1281-torch291-ubuntu2404@sha256:07e19c816cce2ac04c04436d6ada7eb15eec2ea2ab2f467f35a4f800ec79e1be

jobs:
  prepare-transfer:
    name: Prepare identical single and split artifacts before renting GPU
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      manifest_sha256: ${{ steps.prepare.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the measured tenferro-rs archive
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          repository: tensor4all/tenferro-rs
          run-id: 37740724065
          github-token: ${{ github.token }}
          name: cuda-pjrt-archive-v16-ci-ubuntu22.04-rust1.99.0-cuda12080-ptx12.8-db254076aec0d6d0c2f083fb66fcb0ada9ea72be7bf5ba114916f42f6a75e979
          path: _transfer_source
      - name: Partition the same files into five transfer artifacts
        id: prepare
        run: |
          python3 scripts/ci/artifact_transfer_experiment.py prepare
          echo "manifest_sha256=$(sha256sum _transfer_source/transfer.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Publish the single-artifact baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transfer-single-${{ github.run_id }}
          path: _transfer_source
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Publish partition 0
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transfer-split-${{ github.run_id }}-00
          path: _transfer_parts/00
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Publish partition 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transfer-split-${{ github.run_id }}-01
          path: _transfer_parts/01
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Publish partition 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transfer-split-${{ github.run_id }}-02
          path: _transfer_parts/02
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Publish partition 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transfer-split-${{ github.run_id }}-03
          path: _transfer_parts/03
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Publish partition 4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transfer-split-${{ github.run_id }}-04
          path: _transfer_parts/04
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  start-runpod:
    name: Start ephemeral RunPod runner
    needs: [prepare-transfer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pod_id: ${{ steps.create_pod.outputs.pod_id }}
      runner_label: ${{ steps.create_pod.outputs.runner_label }}
      gpu_cost_per_hr: ${{ steps.create_pod.outputs.gpu_cost_per_hr }}
    steps:
      - name: Checkout trusted benchmark harness
        uses: actions/checkout@v4
        with:
          ref: 2eea3c04cede56419ce12a892d6998f97bea14cb
          persist-credentials: false

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-organization-self-hosted-runners: write

      - name: Validate RunPod configuration
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python3 -m scripts.ci.runpod_contract --config scripts/ci/runpod_config.json

      - name: Bound this experiment to one inexpensive candidate
        run: |
          python3 - <<'CONFIG'
          import json
          from pathlib import Path
          from scripts.ci.runpod_pricing import fetch_gpu_offers, http_transport, GRAPHQL_URL
          path = Path('scripts/ci/runpod_config.json')
          config = json.loads(path.read_text())
          ids = [gpu for tier in config['gpu_tiers'] for gpu in tier['gpu_type_ids']]
          offers = fetch_gpu_offers(ids, min_vram_gb=config['min_vram_gb'], transport=http_transport(GRAPHQL_URL))
          eligible = [offer for offer in offers if offer.price_per_hr <= 0.50]
          if not eligible:
              raise SystemExit('No reviewed in-stock GPU below $0.50/hr; no pod created')
          selected = eligible[0]
          print(f'One experiment candidate: {selected.gpu_type_id} at ${selected.price_per_hr:.2f}/hr')
          config['gpu_tiers'] = [{'name': 'experiment', 'gpu_type_ids': [selected.gpu_type_id]}]
          config['max_price_candidates'] = 1
          config['max_provision_attempts'] = 1
          config['same_tier_retries'] = 0
          path.write_text(json.dumps(config))
          CONFIG

      - name: Provision compatible RunPod GPU
        id: create_pod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          PROVISION_GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PROVISION_ORG: ${{ github.repository_owner }}
          PROVISION_RUNNER_GROUP_ID: ${{ vars.RUNPOD_RUNNER_GROUP_ID || '4' }}
          PROVISION_RUNNER_LABEL: runpod-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          cat > /tmp/runpod-startup.sh <<'STARTUP'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          export RUNNER_ALLOW_RUNASROOT=1
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl tar gzip zstd python3 python3-pip git
          nvidia-smi
          cat > /tmp/cuda_smoke_test.py <<'SMOKE'
          STARTUP
          cat scripts/ci/cuda_smoke_test.py >> /tmp/runpod-startup.sh
          cat >> /tmp/runpod-startup.sh <<'STARTUP'
          SMOKE
          env -u RUNNER_JIT_CONFIG python3 /tmp/cuda_smoke_test.py \
            --min-runtime-version 12.8 --full-runtime-version 12.8 --min-vram-gb 8 --skip-nvrtc-install
          cd /tmp
          version=2.337.0
          sha256=70920811a4f8ad4328818682bca5c6469c1c942fab52448868071d0063816613
          tarball="actions-runner-linux-x64-${version}.tar.gz"
          curl -fsSL -o "${tarball}" "https://github.com/actions/runner/releases/download/v${version}/${tarball}"
          echo "${sha256}  ${tarball}" | sha256sum -c -
          mkdir -p actions-runner
          cd actions-runner
          tar xzf "../${tarball}"
          ./bin/installdependencies.sh
          ./run.sh --jitconfig "${RUNNER_JIT_CONFIG}"
          STARTUP
          python3 -m scripts.ci.runpod_provision \
            --config scripts/ci/runpod_config.json \
            --startup-script /tmp/runpod-startup.sh \
            --image-name "$RUNPOD_IMAGE" \
            --response-file /tmp/runpod-response.json

      - name: Delete pod after startup failure
        if: ${{ (failure() || cancelled()) && steps.create_pod.outputs.pod_id != '' }}
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          POD_ID: ${{ steps.create_pod.outputs.pod_id }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/delete-startup.json -w '%{http_code}' \
            -X DELETE "https://rest.runpod.io/v1/pods/${POD_ID}" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}")"
          [[ "$status" == 404 || ("$status" -ge 200 && "$status" -lt 300) ]]

  run-transfer:
    name: Compare actual artifact transfer on one RunPod pod
    needs: [prepare-transfer, start-runpod]
    runs-on:
      - self-hosted
      - ${{ needs.start-runpod.outputs.runner_label }}
    timeout-minutes: 20
    env:
      TRANSFER_MANIFEST_SHA256: ${{ needs.prepare-transfer.outputs.manifest_sha256 }}
    steps:
      - name: Checkout the experiment harness
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record device and harness identity
        run: |
          nvidia-smi
          git rev-parse HEAD
          python3 --version
      - name: Start 1-single
        run: python3 scripts/ci/artifact_transfer_experiment.py start --label 1-single
      - name: Transfer 1-single
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: transfer-single-${{ github.run_id }}
          path: _transfer_results/1-single
      - name: Reconstruct and verify 1-single
        timeout-minutes: 1
        run: >-
          python3 scripts/ci/artifact_transfer_experiment.py finish
          --label 1-single --arm single
          --manifest-sha256 "$TRANSFER_MANIFEST_SHA256"
      - name: Start 1-split
        run: python3 scripts/ci/artifact_transfer_experiment.py start --label 1-split
      - name: Transfer 1-split
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: transfer-split-${{ github.run_id }}-*
          merge-multiple: true
          path: _transfer_results/1-split
      - name: Reconstruct and verify 1-split
        timeout-minutes: 1
        run: >-
          python3 scripts/ci/artifact_transfer_experiment.py finish
          --label 1-split --arm split
          --manifest-sha256 "$TRANSFER_MANIFEST_SHA256"
      - name: Start 2-split
        run: python3 scripts/ci/artifact_transfer_experiment.py start --label 2-split
      - name: Transfer 2-split
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: transfer-split-${{ github.run_id }}-*
          merge-multiple: true
          path: _transfer_results/2-split
      - name: Reconstruct and verify 2-split
        timeout-minutes: 1
        run: >-
          python3 scripts/ci/artifact_transfer_experiment.py finish
          --label 2-split --arm split
          --manifest-sha256 "$TRANSFER_MANIFEST_SHA256"
      - name: Start 2-single
        run: python3 scripts/ci/artifact_transfer_experiment.py start --label 2-single
      - name: Transfer 2-single
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: transfer-single-${{ github.run_id }}
          path: _transfer_results/2-single
      - name: Reconstruct and verify 2-single
        timeout-minutes: 1
        run: >-
          python3 scripts/ci/artifact_transfer_experiment.py finish
          --label 2-single --arm single
          --manifest-sha256 "$TRANSFER_MANIFEST_SHA256"
      - name: Start 3-single
        run: python3 scripts/ci/artifact_transfer_experiment.py start --label 3-single
      - name: Transfer 3-single
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: transfer-single-${{ github.run_id }}
          path: _transfer_results/3-single
      - name: Reconstruct and verify 3-single
        timeout-minutes: 1
        run: >-
          python3 scripts/ci/artifact_transfer_experiment.py finish
          --label 3-single --arm single
          --manifest-sha256 "$TRANSFER_MANIFEST_SHA256"
      - name: Start 3-split
        run: python3 scripts/ci/artifact_transfer_experiment.py start --label 3-split
      - name: Transfer 3-split
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: transfer-split-${{ github.run_id }}-*
          merge-multiple: true
          path: _transfer_results/3-split
      - name: Reconstruct and verify 3-split
        timeout-minutes: 1
        run: >-
          python3 scripts/ci/artifact_transfer_experiment.py finish
          --label 3-split --arm split
          --manifest-sha256 "$TRANSFER_MANIFEST_SHA256"
      - name: Summarize the complete predeclared comparison
        if: always()
        run: python3 scripts/ci/artifact_transfer_experiment.py report
      - name: Retain all timings and validity observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-transfer-results-${{ github.run_id }}
          path: |
            _transfer_results/report.json
            _transfer_results/samples.jsonl
          retention-days: 30
          if-no-files-found: error

  cleanup-runpod:
    name: Delete RunPod pod
    if: always()
    needs: [start-runpod, run-transfer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete RunPod pod
        if: needs.start-runpod.outputs.pod_id != ''
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          POD_ID: ${{ needs.start-runpod.outputs.pod_id }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/delete.json -w '%{http_code}' \
            -X DELETE "https://rest.runpod.io/v1/pods/${POD_ID}" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}")"
          cat /tmp/delete.json || true
          [[ "$status" == 404 || ("$status" -ge 200 && "$status" -lt 300) ]]
