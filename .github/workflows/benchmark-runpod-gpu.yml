name: benchmark-runpod-gpu
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: runpod-prepared-runtime-build
  cancel-in-progress: false
jobs:
  prepare:
    name: Build and validate prepared runner (no GPU or publication)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Checkout frozen baseline validation helpers
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: tensor4all/tenferro-rs
          ref: 356a2011ef0f9d2d345ed31201fbe838995329a2
          path: source
          persist-credentials: false
      - name: Download frozen runtime bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          repository: tensor4all/tenferro-rs
          run-id: 38034449617
          pattern: gpu-runtime-38034449617-*
          path: frozen-runtime
          github-token: ${{ github.token }}
      - name: Verify and assemble complete prepared payload
        run: |
          set -euo pipefail
          python3 scripts/runpod-prepared-runtime/prepare-image.py --artifacts frozen-runtime --context image-context
          cp scripts/runpod-prepared-runtime/Dockerfile image-context/Dockerfile
          df -h .
      - name: Build prepared image
        run: docker build --tag tenferro-prepared-runner:validated image-context
      - name: Validate both CUDA tiers and prepared dependencies without a GPU
        run: |
          set -euo pipefail
          docker run --rm --user root --entrypoint bash \
            -v "$GITHUB_WORKSPACE/source:/source:ro" \
            -v "$GITHUB_WORKSPACE/scripts/runpod-prepared-runtime/validate-image.sh:/validate.sh:ro" \
            tenferro-prepared-runner:validated /validate.sh
      - name: Save image for human publication handoff
        run: |
          set -euo pipefail
          mkdir image-export
          docker image inspect tenferro-prepared-runner:validated > image-export/image-inspect.json
          cp image-context/payload/opt/ci-cost-runtime/prepared-image.json image-export/runtime-manifest.json
          printf '%s\n' "$GITHUB_SHA" > image-export/source-commit.txt
          docker save tenferro-prepared-runner:validated | zstd -T4 -3 -o image-export/prepared-runner.tar.zst
          (cd image-export && sha256sum prepared-runner.tar.zst > prepared-runner.sha256)
      - name: Retain validated image without publishing a registry package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runpod-prepared-runner-image
          path: image-export/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
