name: benchmark-runpod-gpu
run-name: ${{ inputs.suite == 'perf-issues-readback' && 'RunPod readback (manual report)' || 'RunPod GPU benchmark' }}

on:
  # Weekly collection with weekend retry slots. The first slot that succeeds
  # provides that week's results; later slots skip before renting a GPU
  # (scripts/ci/weekly_gate.py). Times are UTC.
  schedule:
    - cron: "0 8 * * 6"
    - cron: "0 14 * * 6"
    - cron: "0 20 * * 6"
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      suite:
        description: GPU suite YAML, all GPU suites, or perf-issues-readback
        required: true
        default: all
        type: string
      backends:
        description: Comma-separated GPU backends
        required: true
        default: tenferro-cuda-trace,tenferro-cuda-eager,pytorch-cuda
        type: string
      prepare_only:
        description: Prepare binaries and runtime only, without renting a GPU
        required: false
        default: false
        type: boolean
      keep_failed_pod:
        description: Keep the pod for debugging (continues billing)
        required: false
        default: false
        type: boolean
      gpu_type:
        description: RunPod GPU type ID, or a tier name of scripts/ci/runpod_config.json (a100 = any A100, the standard nvidia-gpu hardware)
        required: false
        default: a100
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-runpod-gpu
  cancel-in-progress: false

env:
  RUNPOD_IMAGE: runpod/pytorch:1.1.0-cu1281-torch291-ubuntu2404@sha256:07e19c816cce2ac04c04436d6ada7eb15eec2ea2ab2f467f35a4f800ec79e1be
  CUDA_HOME: /usr/local/cuda-12.8
  CUDA_PATH: /usr/local/cuda-12.8
  LD_LIBRARY_PATH: /usr/local/cuda-12.8/lib64
  TENFERRO_CUTENSOR_PATH: /usr/lib/x86_64-linux-gnu/libcutensor/12/libcutensor.so.2
  TENFERRO_CPU_FEATURES: none
  UV_NO_SYNC: "1"
  BENCHMARK_TARGET_PROFILE: nvidia-gpu
  # Scheduled runs have no inputs; jobs fall back to the weekly defaults
  # (suite=all, default backends, A100).
  BENCH_GPU_TYPE: ${{ inputs.gpu_type || 'a100' }}
  # Hard cap on one pod's lifetime, enforced by the pod itself (see startup).
  # Budget: <=10 min startup (startup_timeout_seconds) + 42 min benchmark job
  # timeout + cleanup stays below it.
  POD_MAX_LIFETIME_SECONDS: "3300"

jobs:
  weekly-gate:
    name: Skip if this week's GPU results already exist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check for this week's successful scheduled run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.ci.weekly_gate --repository "$GITHUB_REPOSITORY" --event "$GITHUB_EVENT_NAME" --run-id "$GITHUB_RUN_ID"

  prepare-benchmark:
    name: Build GPU benchmark before renting GPU
    needs: weekly-gate
    if: needs.weekly-gate.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      tenferro_commit: ${{ steps.build.outputs.tenferro_commit }}
      binary_name: ${{ steps.build.outputs.binary_name }}
      rustc_version: ${{ steps.build.outputs.rustc_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare CUDA build toolchain and current sources
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libomp-dev pkg-config libssl-dev
          curl -fsSL -o /tmp/cuda-keyring.deb https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cuda-toolkit-12-8
          export PATH="$CUDA_HOME/bin:$PATH"
          ./scripts/setup_extern_deps.sh
          if [[ "$(git -C extern/tenferro-rs branch --show-current)" == main ]]; then
            git -C extern/tenferro-rs pull --ff-only
          fi
          cargo generate-lockfile
      - name: Restore Cargo dependencies and compiled artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: runpod-gpu-ubuntu24.04-cuda12.8-v1
          cache-workspace-crates: true
          cache-bin: false
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST CUDA TENFERRO
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build current CUDA benchmark with Cargo cache
        id: build
        env:
          REQUESTED_SUITE: ${{ inputs.suite || 'all' }}
        run: |
          set -euo pipefail
          export PATH="$CUDA_HOME/bin:$PATH"
          # The routine set collects both the generic runner and the linalg AD
          # runner on the pod, which has a CUDA runtime but no Rust toolchain.
          binaries=(benchmark_gpu_rust benchmark_gpu_linalg_ad)
          if [[ "$REQUESTED_SUITE" == perf-issues-readback ]]; then
            binaries=(benchmark_gpu_perf_issues)
          fi
          build_args=()
          for binary in "${binaries[@]}"; do
            build_args+=(--bin "$binary")
          done
          cargo build --locked --release --features cuda "${build_args[@]}"
          {
            echo "binary_name=${binaries[0]}"
            echo "artifact_paths<<BUILD_PATHS"
            for binary in "${binaries[@]}"; do
              python3 scripts/ci/gpu_artifact.py "target/release/$binary" --write
              echo "target/release/$binary"
              echo "target/release/$binary.json"
            done
            echo "BUILD_PATHS"
          } >> "$GITHUB_OUTPUT"
          echo "rustc_version=$(rustc --version)" >> "$GITHUB_OUTPUT"
          echo "tenferro_commit=$(git -C extern/tenferro-rs rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-benchmark-build-${{ github.run_id }}
          path: ${{ steps.build.outputs.artifact_paths }}
          retention-days: 7
          if-no-files-found: error

  prepare-environment:
    name: Prepare runtime before renting GPU
    needs: weekly-gate
    if: needs.weekly-gate.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      sha256: ${{ steps.identity.outputs.sha256 }}
    env:
      # The arms the prepared pod runtime must cover. This is infrastructure, not
      # a selection filter: the routine set names its own arms in
      # benchmarks/gpu/manifests/routine.yaml.
      GPU_BENCH_RUNTIME_BACKENDS: ${{ inputs.backends || 'tenferro-cuda-trace,tenferro-cuda-eager,pytorch-cuda,jax-cuda' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.21"
          enable-cache: false
      - name: Identify locked runtime environment
        id: key
        run: echo "key=$(python3 scripts/ci/gpu_environment.py key --backends "$GPU_BENCH_RUNTIME_BACKENDS")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: _gpu_environment
          key: ${{ steps.key.outputs.key }}
      - name: Prepare Python and minimal CUDA runtime
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/prepare_gpu_environment.sh
      - name: Verify runtime archive and export digest
        id: identity
        run: |
          set -euo pipefail
          sha256=$(python3 -c 'import json; print(json.load(open("_gpu_environment/runtime.json"))["archive_sha256"])')
          python3 scripts/ci/gpu_environment.py verify --backends "$GPU_BENCH_RUNTIME_BACKENDS" --sha256 "$sha256"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: _gpu_environment
          key: ${{ steps.key.outputs.key }}
      - name: Split runtime into bounded parallel transfer parts
        id: split
        run: echo "count=$(python3 scripts/ci/gpu_environment.py split)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-runtime-${{ github.run_id }}-manifest
          path: |
            _gpu_transfer/runtime.json
            _gpu_transfer/runtime.parts.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.split.outputs.count) > 0 }}
        with:
          name: gpu-runtime-${{ github.run_id }}-00
          path: _gpu_transfer/runtime.part00
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.split.outputs.count) > 1 }}
        with:
          name: gpu-runtime-${{ github.run_id }}-01
          path: _gpu_transfer/runtime.part01
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.split.outputs.count) > 2 }}
        with:
          name: gpu-runtime-${{ github.run_id }}-02
          path: _gpu_transfer/runtime.part02
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.split.outputs.count) > 3 }}
        with:
          name: gpu-runtime-${{ github.run_id }}-03
          path: _gpu_transfer/runtime.part03
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.split.outputs.count) > 4 }}
        with:
          name: gpu-runtime-${{ github.run_id }}-04
          path: _gpu_transfer/runtime.part04
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.split.outputs.count) > 5 }}
        with:
          name: gpu-runtime-${{ github.run_id }}-05
          path: _gpu_transfer/runtime.part05
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.split.outputs.count) > 6 }}
        with:
          name: gpu-runtime-${{ github.run_id }}-06
          path: _gpu_transfer/runtime.part06
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.split.outputs.count) > 7 }}
        with:
          name: gpu-runtime-${{ github.run_id }}-07
          path: _gpu_transfer/runtime.part07
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  start-runpod:
    name: Start ephemeral RunPod runner
    if: ${{ !inputs.prepare_only }}
    needs: [prepare-benchmark, prepare-environment]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      pod_id: ${{ steps.create_pod.outputs.pod_id }}
      runner_label: ${{ steps.create_pod.outputs.runner_label }}
    steps:
      - name: Checkout trusted benchmark harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-organization-self-hosted-runners: write

      - name: Validate RunPod configuration
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python3 -m scripts.ci.runpod_contract --config scripts/ci/runpod_config.json

      - name: Provision compatible RunPod GPU
        id: create_pod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_GPU_TYPE: ${{ env.BENCH_GPU_TYPE }}
          PROVISION_GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PROVISION_ORG: ${{ github.repository_owner }}
          PROVISION_RUNNER_GROUP_ID: ${{ vars.RUNPOD_RUNNER_GROUP_ID || '4' }}
          PROVISION_RUNNER_LABEL: runpod-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python3 -m scripts.ci.runpod_watchdog \
            --config scripts/ci/runpod_config.json \
            --lifetime "$POD_MAX_LIFETIME_SECONDS" > /tmp/runpod-startup.sh
          cat >> /tmp/runpod-startup.sh <<'STARTUP'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          export RUNNER_ALLOW_RUNASROOT=1
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl tar gzip zstd python3 python3-pip git
          nvidia-smi
          cat > /tmp/cuda_smoke_test.py <<'SMOKE'
          STARTUP
          cat scripts/ci/cuda_smoke_test.py >> /tmp/runpod-startup.sh
          cat >> /tmp/runpod-startup.sh <<'STARTUP'
          SMOKE
          env -u RUNNER_JIT_CONFIG python3 /tmp/cuda_smoke_test.py \
            --min-runtime-version 12.8 --full-runtime-version 12.8 --min-driver-version 12.8 --min-vram-gb 8 --skip-nvrtc-install
          cd /tmp
          version=2.337.0
          sha256=70920811a4f8ad4328818682bca5c6469c1c942fab52448868071d0063816613
          tarball="actions-runner-linux-x64-${version}.tar.gz"
          curl -fsSL -o "${tarball}" "https://github.com/actions/runner/releases/download/v${version}/${tarball}"
          echo "${sha256}  ${tarball}" | sha256sum -c -
          mkdir -p actions-runner
          cd actions-runner
          tar xzf "../${tarball}"
          ./bin/installdependencies.sh
          ./run.sh --jitconfig "${RUNNER_JIT_CONFIG}"
          STARTUP
          python3 -m scripts.ci.runpod_provision \
            --config scripts/ci/runpod_config.json \
            --startup-script /tmp/runpod-startup.sh \
            --image-name "$RUNPOD_IMAGE" \
            --response-file /tmp/runpod-response.json

      - name: Delete pod after startup failure
        if: ${{ (failure() || cancelled()) && steps.create_pod.outputs.pod_id != '' }}
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          POD_ID: ${{ steps.create_pod.outputs.pod_id }}
        run: |
          set -euo pipefail
          python3 -m scripts.ci.runpod_http delete --config scripts/ci/runpod_config.json

  run-gpu-benchmark:
    name: Run GPU benchmark on RunPod
    needs: [prepare-benchmark, prepare-environment, start-runpod]
    runs-on:
      - self-hosted
      - ${{ needs.start-runpod.outputs.runner_label }}
    # Part of the one-hour rental budget; see POD_MAX_LIFETIME_SECONDS.
    timeout-minutes: 42
    env:
      # Arms the prepared runtime covers; not a selection filter.
      GPU_BENCH_RUNTIME_BACKENDS: ${{ inputs.backends || 'tenferro-cuda-trace,tenferro-cuda-eager,pytorch-cuda,jax-cuda' }}
      REQUESTED_SUITE: ${{ inputs.suite || 'all' }}
      TENFERRO_REF: ${{ needs.prepare-benchmark.outputs.tenferro_commit }}
      TENFERRO_UPDATE: "1"
      GPU_BENCH_PREBUILT_RUST: "1"
      GPU_BENCH_BINARY_NAME: ${{ needs.prepare-benchmark.outputs.binary_name }}
      BENCHMARK_RUSTC_VERSION: ${{ needs.prepare-benchmark.outputs.rustc_version }}
      BENCHMARK_EXECUTION_ENVIRONMENT: runpod
      GPU_RUNTIME_SHA256: ${{ needs.prepare-environment.outputs.sha256 }}
    steps:
      - name: Verify pod lifetime watchdog is armed
        run: |
          set -euo pipefail
          cat /tmp/pod-watchdog.status
          kill -0 "$(cat /tmp/pod-watchdog.pid)"
          # The exact HTTP client used by the watchdog verifies its credentials.
          python3 /tmp/runpod_http.py get --api-url "$(cat /tmp/pod-watchdog-api-url)"
          echo "Pod watchdog starts deletion after ${POD_MAX_LIFETIME_SECONDS}s (180s retry budget)."

      - name: Checkout benchmark harness
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Transfer prepared runtime from hosted runner
        timeout-minutes: 10
        uses: actions/download-artifact@v4
        with:
          pattern: gpu-runtime-${{ github.run_id }}-*
          merge-multiple: true
          path: _gpu_environment
      - name: Verify and extract prepared runtime
        timeout-minutes: 10
        run: bash scripts/ci/restore_gpu_environment.sh
      - name: Pin benchmark dependency to hosted build revision
        run: |
          set -euo pipefail
          ./scripts/setup_extern_deps.sh
          test "$(git -C extern/tenferro-rs rev-parse HEAD)" = "$TENFERRO_REF"

      - uses: actions/download-artifact@v4
        with:
          name: gpu-benchmark-build-${{ github.run_id }}
          path: target/release
      - name: Verify hosted benchmark build
        run: |
          set -euo pipefail
          # The generic runner is always shipped; the linalg AD runner only for
          # the routine collection (the manual readback runs its own binary).
          for binary in "$GPU_BENCH_BINARY_NAME" benchmark_gpu_linalg_ad; do
            [[ -f "target/release/$binary" ]] || continue
            chmod +x "target/release/$binary"
            python3 scripts/ci/gpu_artifact.py "target/release/$binary"
          done

      - name: Verify CUDA benchmark environment
        run: |
          set -euo pipefail
          nvidia-smi
          cat /opt/tenferro-benchmark-ci/runtime-packages.txt
          python3 scripts/ci/check_cuda_headers.py --cuda-root "$CUDA_HOME"
          uv run python - <<'PY'
          import ctypes
          import torch
          ctypes.CDLL("libcuda.so.1")
          ctypes.CDLL("libnvrtc.so.12")
          import os
          ctypes.CDLL(os.environ["TENFERRO_CUTENSOR_PATH"])
          assert torch.cuda.is_available(), "PyTorch CUDA is unavailable"
          value = torch.ones(16, device="cuda")
          result = value + value
          torch.cuda.synchronize()
          assert result.sum().item() == 32
          print(f"PyTorch {torch.__version__}, CUDA {torch.version.cuda}")
          print(torch.cuda.get_device_name(0))
          PY

      - name: Run GPU benchmark suite
        id: collect
        env:
          # Only an explicit dispatch narrows the arms. An empty value keeps the
          # scheduled run on the routine manifest's own set, so it still runs the
          # routine controls and refreshes the routine reports.
          GPU_BENCH_BACKENDS: ${{ inputs.backends }}
        run: |
          set -euo pipefail
          GPU_BENCH_TIMESTAMP="$(date +%Y%m%d_%H%M%S)"
          export GPU_BENCH_TIMESTAMP
          echo "timestamp=$GPU_BENCH_TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "$REQUESTED_SUITE" == perf-issues-readback ]]; then
            ./scripts/ci/run_gpu_readback.sh
            exit 0
          fi
          if [[ "$REQUESTED_SUITE" == all ]]; then
            ./scripts/run_gpu_suite.sh
          else
            GPU_BENCH_SUITE="$REQUESTED_SUITE" ./scripts/run_gpu_suite.sh
          fi

      - name: Package this collection's GPU results
        if: always() && inputs.suite != 'perf-issues-readback' && steps.collect.outputs.timestamp != ''
        env:
          COLLECTION_TIMESTAMP: ${{ steps.collect.outputs.timestamp }}
          COLLECTION_STARTED_AT: ${{ steps.collect.outputs.started_at }}
        run: |
          uv run --no-project --python 3.12 --with-requirements scripts/dashboard-requirements.txt --with jsonschema \
            python scripts/ci/prepare_result_bundle.py --profile nvidia-gpu --harness-commit "$GITHUB_SHA" \
            --started-at "$COLLECTION_STARTED_AT" --timestamp "$COLLECTION_TIMESTAMP" \
            --backends "$GPU_BENCH_RUNTIME_BACKENDS" --suites "$REQUESTED_SUITE" --bundle-dir _benchmark_artifact

      - name: Archive benchmark results
        if: always() && inputs.suite != 'perf-issues-readback' && hashFiles('_benchmark_artifact/publication.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: runpod-gpu-benchmark-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            _benchmark_artifact
          if-no-files-found: error
          retention-days: 90

      - name: Archive standalone readback results for review
        if: always() && inputs.suite == 'perf-issues-readback' && steps.collect.outputs.readback_timestamp != ''
        uses: actions/upload-artifact@v4
        with:
          name: runpod-gpu-readback-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            data/results/nvidia-gpu/gpu/perf_issues/${{ steps.collect.outputs.readback_timestamp }}
            data/results/nvidia-gpu/gpu/perf_issues/${{ steps.collect.outputs.readback_timestamp }}_verify
            result/nvidia-gpu/gpu/perf_issues.md
            result/nvidia-gpu/gpu/perf_issues.summary.json
          if-no-files-found: warn
          retention-days: 90

      - name: Archive failed-run diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runpod-gpu-diagnostics-${{ github.run_id }}
          path: |
            data/results/nvidia-gpu
            result/nvidia-gpu
          if-no-files-found: warn
          retention-days: 7

  cleanup-runpod:
    name: Delete RunPod pod
    if: always()
    needs: [start-runpod, run-gpu-benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Delete RunPod pod
        if: >-
          needs.start-runpod.outputs.pod_id != '' &&
          !(inputs.keep_failed_pod == true && needs.run-gpu-benchmark.result == 'failure')
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          POD_ID: ${{ needs.start-runpod.outputs.pod_id }}
        run: |
          set -euo pipefail
          python3 -m scripts.ci.runpod_http delete --config scripts/ci/runpod_config.json
