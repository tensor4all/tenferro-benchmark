name: benchmark-nightly-mac-cpu

on:
  schedule:
    # 02:17 JST (17:17 UTC) every day; picked to avoid the :00/:30 herd.
    - cron: "17 17 * * *"
  workflow_dispatch:
    inputs:
      tenferro_ref:
        description: "tenferro-rs ref to benchmark (default: pins/tenferro-rs.rev)"
        required: false
        default: ""

# This workflow uses a GitHub-hosted runner, so results are reference-quality
# indicators only. Canonical regression tracking still requires a stable
# dedicated self-hosted runner.
permissions:
  contents: read

concurrency:
  group: benchmark-mac-cpu-canonical
  cancel-in-progress: false

env:
  # Pin the interpreter: the macos-26 image's Homebrew python moved to 3.15
  # (2026-10), for which the locked torch release has no wheel.
  UV_PYTHON: "3.14"

jobs:
  mac-cpu:
    # Restrict to the canonical repository only.
    if: github.repository == 'tensor4all/tenferro-benchmark'
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - name: Checkout benchmark harness
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          # Track the latest stable Julia 1.x (matching the release channel used
          # for the recorded results and the committed Manifest.toml).
          version: "1"

      - name: Prepare environment and pin tenferro-rs revision
        env:
          TENFERRO_REF: ${{ inputs.tenferro_ref }}
          TENFERRO_UPDATE: "1"
        run: |
          uv sync --frozen || uv sync
          ./scripts/setup_extern_deps.sh
          # setup checks out a detached revision. Subsequent suites reuse it.
          echo "TENFERRO_REF=$(git -C extern/tenferro-rs rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "TENFERRO_UPDATE=0" >> "$GITHUB_ENV"

      - name: Run mac-cpu core suites
        env:
          BENCHMARK_TARGET_PROFILE: mac-cpu
          PUBLICATION_GATE_PROFILE: quick
          BENCHMARK_ALLOW_BUSY_HOST: "1"
        run: |
          # Native macOS execution path per AGENTS.md.
          # GitHub-hosted runners are shared, so the idle-host guard is bypassed.
          # Use the quick public-api profile to keep the nightly job within
          # GitHub-hosted runner time limits; these are reference indicators only.
          trap 'echo "CPU collection failed at line $LINENO: $BASH_COMMAND" >&2' ERR
          ./scripts/run_all.sh 1 4

      - name: Package this collection's CPU results
        run: |
          uv run --no-project --with pyyaml --with jsonschema python scripts/ci/bundle_cpu_results.py \
            --profile mac-cpu --harness-commit "$GITHUB_SHA" --threads 1 4

      - name: Archive validated raw bundle
        uses: actions/upload-artifact@v4
        with:
          name: mac-cpu-benchmark-results-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: _cpu_benchmark_artifact/
          if-no-files-found: error
          retention-days: 90

      - name: Archive failed collection diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-cpu-benchmark-diagnostics-${{ github.run_id }}
          path: |
            data/results/mac-cpu
            result/mac-cpu
            _cpu_benchmark_artifact/
          retention-days: 90
