name: debug-runpod-a100

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-runpod-a100
  cancel-in-progress: false

jobs:
  diagnose:
    name: Inspect A100 availability without renting a pod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare production and unfiltered CUDA availability
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python3 -m scripts.ci.runpod_diagnostics --output-dir _runpod_diagnostics
      - name: Upload diagnostics even when API checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runpod-a100-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: _runpod_diagnostics
          if-no-files-found: warn
          retention-days: 7
