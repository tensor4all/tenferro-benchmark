[package]
name = "cpu-followup-mwe"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[workspace]

[features]
default = ["system-mkl"]
system-mkl = ["tenferro-cpu/blas", "tenferro-ad/blas", "tenferro-fft/blas", "tenferro-linalg/blas"]
system-openblas = ["tenferro-cpu/blas", "tenferro-ad/blas", "tenferro-fft/blas", "tenferro-linalg/blas"]

[dependencies]
tenferro-ad = { path = "../../extern/tenferro-rs/crates/tenferro-ad", default-features = false }
tenferro-cpu = { path = "../../extern/tenferro-rs/crates/tenferro-cpu", default-features = false }
tenferro-tensor = { path = "../../extern/tenferro-rs/crates/tenferro-tensor", default-features = false }
tenferro-runtime = { path = "../../extern/tenferro-rs/crates/tenferro-runtime", default-features = false }
tenferro-fft = { path = "../../extern/tenferro-rs/crates/tenferro-fft", default-features = false, features = ["autodiff"] }
tenferro-linalg = { path = "../../extern/tenferro-rs/crates/tenferro-linalg", default-features = false, features = ["autodiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-complex = "0.4"
libm = "0.2"
rayon = "1"
strided-perm = { path = "../../extern/strided-rs/strided-perm", default-features = false, features = ["parallel"] }
strided-view = { path = "../../extern/strided-rs/strided-view" }
